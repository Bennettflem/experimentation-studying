{s:"Code: Functions",q:"int max_in_array(int *arr, int len) {\n    int max = 0;\n    for (int i = 0; i < len; i++) {\n        if (arr[i] > max)\n            max = arr[i];\n    }\n    return max;\n}",a:"BUG — Wrong initial value:\nInitializing max to 0 means if ALL elements are negative, the function returns 0 (incorrect).\n\nFIX:\n  if (len <= 0) return INT_MIN;\n  int max = arr[0];\n  for (int i = 1; i < len; i++) {\n      if (arr[i] > max) max = arr[i];\n  }"},
{s:"Code: Functions",q:"void swap(int a, int b) {\n    int tmp = a;\n    a = b;\n    b = tmp;\n}\n\nint main(void) {\n    int x = 3, y = 7;\n    swap(x, y);\n    printf(\"x=%d y=%d\\n\", x, y);\n    return 0;\n}",a:"BUG — Arguments passed by value:\nC passes by value. a and b inside swap are copies. Modifying them has no effect on x and y in the caller. Output: x=3 y=7 (unchanged).\n\nFIX — Pass by pointer:\n  void swap(int *a, int *b) {\n      int tmp = *a;\n      *a = *b;\n      *b = tmp;\n  }\n  swap(&x, &y);"},
{s:"Code: Functions",q:"int sum_digits(int n) {\n    int sum = 0;\n    while (n > 0) {\n        sum += n % 10;\n        n /= 10;\n    }\n    return sum;\n}",a:"BUG — Fails for negative numbers:\nIf n is negative, n > 0 is immediately false — returns 0 instead of digit sum.\n\nn % 10 for negative n gives a negative remainder in C99.\n\nEdge case: n = INT_MIN cannot be negated safely (overflow).\n\nFIX:\n  unsigned int un = (n < 0)\n      ? -(unsigned int)n\n      : (unsigned int)n;\n  while (un > 0) {\n      sum += un % 10;\n      un /= 10;\n  }"},
{s:"Code: Functions",q:"#define BUFFER_SIZE 1024\n\nvoid process_input(void) {\n    char buf[BUFFER_SIZE];\n    gets(buf);\n    printf(\"Got: %s\\n\", buf);\n}",a:"BUG — gets() is unsafe and REMOVED from C11:\ngets() reads unbounded input. Any input longer than 1024 bytes overflows buf. There is NO safe way to use gets().\n\nFIX:\n  if (!fgets(buf, sizeof(buf), stdin))\n      return;\n  // fgets includes '\\n'; strip it:\n  buf[strcspn(buf, \"\\n\")] = '\\0';"},
{s:"Code: Functions",q:"int power(int base, int exp) {\n    if (exp == 0) return 1;\n    return base *\n           power(base, exp - 1);\n}",a:"BUGS:\n\n1. No handling of negative exponent — power(2, -1) recurses forever → stack overflow.\n\n2. Integer overflow for large base/exp.\n\n3. Inefficient: O(exp) multiplications. Use fast exponentiation O(log n).\n\nFIX:\n  long long power(long long base, int exp) {\n      if (exp < 0) return 0;\n      if (exp == 0) return 1;\n      if (exp % 2 == 0) {\n          long long half = power(base, exp/2);\n          return half * half;\n      }\n      return base * power(base, exp-1);\n  }"},
{s:"Code: Functions",q:"int count_set_bits(unsigned int n) {\n    int count = 0;\n    while (n) {\n        count += n & 1;\n        n >> 1;\n    }\n    return count;\n}",a:"BUG — n >> 1 does not modify n:\nn >> 1 computes the shifted value but DISCARDS it. n is unchanged. The loop runs forever (if n != 0).\n\nFIX:\n  n >>= 1;   // or: n = n >> 1;\n\nIMPROVEMENT — Kernighan's trick:\n  while (n) { n &= (n - 1); count++; }\n  // O(number of set bits) instead of O(32)"},
{s:"Code: Functions",q:"void fill_lookup(void) {\n    int table[256];\n    for (int i = 0; i < 256; i++) {\n        table[i] = i * i;\n    }\n}",a:"BUG — table is computed but never used:\ntable is local. All work is thrown away on return. The compiler will optimize the entire function to nothing at -O2 (dead store elimination).\n\nFIX — Return or use the table:\n  void fill_lookup(int table[256]) {\n      for (int i = 0; i < 256; i++)\n          table[i] = i * i;\n  }\n  // Or: make it static and return a pointer."},
{s:"Code: Functions",q:"int safe_divide(int a, int b,\n                int *result) {\n    if (b == 0) return -1;\n    result = a / b;\n    return 0;\n}",a:"BUG — Assigns to the pointer, not through it:\nresult = a / b sets the local pointer variable to an int value. This is a type mismatch and the caller's storage is never written.\n\nFIX:\n  *result = a / b;  // dereference!"},
{s:"Code: Concurrency",q:"int done = 0;\n\nvoid *producer(void *arg) {\n    sleep(1);\n    done = 1;\n    return NULL;\n}\n\nvoid *consumer(void *arg) {\n    while (!done) { /* spin */ }\n    printf(\"Done!\\n\");\n    return NULL;\n}",a:"BUGS:\n\n1. Data race on done — written by producer, read by consumer, no synchronization. UB in C11.\n\n2. Compiler may cache done in a register and never reload it — consumer spins forever even after done = 1.\n\n3. No memory ordering guarantee.\n\nFIX:\n  _Atomic int done = 0;  // C11 atomic\n\nOr use pthread_mutex + pthread_cond_signal to avoid busy-waiting entirely."},
{s:"Code: Concurrency",q:"pthread_mutex_t lock_a, lock_b;\n/* both initialized */\n\nvoid *thread_one(void *arg) {\n    pthread_mutex_lock(&lock_a);\n    sleep(1);\n    pthread_mutex_lock(&lock_b);\n    pthread_mutex_unlock(&lock_b);\n    pthread_mutex_unlock(&lock_a);\n}\n\nvoid *thread_two(void *arg) {\n    pthread_mutex_lock(&lock_b);\n    sleep(1);\n    pthread_mutex_lock(&lock_a);\n    pthread_mutex_unlock(&lock_a);\n    pthread_mutex_unlock(&lock_b);\n}",a:"BUG — Classic ABBA deadlock:\nIf thread_one acquires lock_a and thread_two acquires lock_b simultaneously, each waits for the other's lock forever.\n\nAll four Coffman conditions hold: mutual exclusion, hold and wait, no preemption, circular wait.\n\nFIX — Enforce consistent lock ordering:\nBoth threads must always acquire lock_a BEFORE lock_b:\n  thread_two:\n    pthread_mutex_lock(&lock_a);  // same order\n    pthread_mutex_lock(&lock_b);"},
{s:"Code: Concurrency",q:"static int initialized = 0;\nstatic MyObject *instance = NULL;\n\nMyObject *get_instance(void) {\n    if (!initialized) {\n        instance = create_object();\n        initialized = 1;\n    }\n    return instance;\n}",a:"BUG — Not thread-safe (singleton race):\nTwo threads can both read initialized == 0, both call create_object() — double initialization, memory leak, and potentially returning a partially-initialized object.\n\nEven a naive double-check with a mutex has memory ordering issues.\n\nFIX — Use pthread_once:\n  static pthread_once_t once =\n      PTHREAD_ONCE_INIT;\n  static void do_init(void) {\n      instance = create_object();\n  }\n  MyObject *get_instance(void) {\n      pthread_once(&once, do_init);\n      return instance;\n  }"},
{s:"Code: Macros",q:"#define SQUARE(x)  x * x\n\nint main(void) {\n    int a = 3;\n    printf(\"%d\\n\",\n           SQUARE(a + 1));  // expect 16\n    printf(\"%d\\n\",\n           100 / SQUARE(5)); // expect 4\n    return 0;\n}",a:"BUG — No parentheses:\nSQUARE(a + 1) → a + 1 * a + 1 → 7 (not 16)\n100 / SQUARE(5) → 100 / 5 * 5 → 100 (not 4)\n\nFIX:\n  #define SQUARE(x) ((x) * (x))\n\nRESIDUAL ISSUE:\nSQUARE(x++) → ((x++) * (x++)) — x incremented twice. For this, prefer an inline function:\n  static inline int square(int x) {\n      return x * x;\n  }"},
{s:"Code: Macros",q:"#define MAX(a, b) \\\n    ((a) > (b) ? (a) : (b))\n\nint main(void) {\n    int x = 5;\n    int y = MAX(x++, 3);\n    printf(\"x=%d y=%d\\n\", x, y);\n    return 0;\n}",a:"BUG — Double evaluation side effect:\nExpands to: ((x++) > (3) ? (x++) : (3))\nSince x=5 > 3, both x++ arms execute — x incremented TWICE.\n\nResult: y = 5 (first x++), x = 7.\nExpected: y = 5, x = 6.\n\nFIX — Use inline function:\n  static inline int max_int(int a, int b) {\n      return a > b ? a : b;\n  }\n  // Arguments evaluated exactly once."},
{s:"Code: Macros",q:"#define ARRAY_SIZE(arr) \\\n    (sizeof(arr) / sizeof(arr[0]))\n\nvoid process(int *arr) {\n    for (int i = 0;\n         i < ARRAY_SIZE(arr); i++) {\n        printf(\"%d\\n\", arr[i]);\n    }\n}",a:"BUG — ARRAY_SIZE on a pointer, not an array:\nWhen arr decays to int* (function parameter), sizeof(arr) = 8 (pointer size on 64-bit). sizeof(arr[0]) = 4. Result: 8/4 = 2.\n\nThe loop iterates only 2 times.\n\nARRAY_SIZE only works on actual array objects in the same scope.\n\nFIX:\n  void process(int *arr, size_t len) {\n      for (size_t i = 0; i < len; i++) ...\n  }"},
{s:"Code: Macros",q:"#define MIN(a,b)  a < b ? a : b\n\nint val = MIN(3, 5) + 1;",a:"BUG — No parentheses:\nExpands to: 3 < 5 ? 3 : 5 + 1\n\nDue to precedence (?: is low): 3 < 5 ? 3 : (5+1) → 3.\nExpected: MIN(3,5) + 1 = 3 + 1 = 4.\n\nFIX:\n  #define MIN(a,b) ((a) < (b) ? (a) : (b))"},
{s:"Code: Security",q:"void handle_input(void) {\n    char name[64];\n    printf(\"Enter name: \");\n    scanf(\"%s\", name);\n    printf(\"Hello, %s\\n\", name);\n}",a:"BUG — scanf %s has no width limit:\n%s reads until whitespace with no length limit — overflows name[64] on long input. Classic stack buffer overflow.\n\nFIX:\n  scanf(\"%63s\", name);  // at most 63 + '\\0'\n  // Or use:\n  fgets(name, sizeof(name), stdin);"},
{s:"Code: Security",q:"int read_packet(int sock,\n                char *buf,\n                int len) {\n    int received =\n        recv(sock, buf, len, 0);\n    buf[received] = '\\0';\n    return received;\n}",a:"BUGS:\n\n1. recv returns -1 on error and 0 on connection close. buf[-1] = '\\0' is an out-of-bounds write.\n\n2. If received == len, buf[len] is one past the end.\n\nFIX:\n  ssize_t received =\n      recv(sock, buf, len - 1, 0);\n  if (received <= 0) return received;\n  buf[received] = '\\0';"},
{s:"Code: Security",q:"int **make_grid(int rows, int cols) {\n    int **grid = malloc(\n        rows * sizeof(int*));\n    for (int i = 0; i < rows; i++) {\n        grid[i] = malloc(\n            cols * sizeof(int));\n    }\n    return grid;\n}\n\nvoid free_grid(int **grid,\n               int rows) {\n    free(grid);\n}",a:"BUG — Memory leak in free_grid:\nEach grid[i] was individually malloc'd but free_grid only frees the outer array. All inner row arrays are leaked.\n\nFIX:\n  void free_grid(int **grid, int rows) {\n      for (int i = 0; i < rows; i++)\n          free(grid[i]);\n      free(grid);\n  }"},
{s:"Code: Security",q:"void copy_input(char *dst,\n                const char *src,\n                size_t dst_size) {\n    if (strlen(src) <= dst_size) {\n        memcpy(dst, src,\n               strlen(src));\n    }\n}",a:"BUGS:\n\n1. Off-by-one: strlen(src) <= dst_size allows copying exactly dst_size bytes — no room for '\\0'.\n\n2. No null terminator written — dst is not a valid C string.\n\n3. strlen called twice (minor inefficiency).\n\nFIX:\n  if (dst_size == 0) return;\n  size_t len = strlen(src);\n  size_t n = (len < dst_size - 1)\n             ? len : dst_size - 1;\n  memcpy(dst, src, n);\n  dst[n] = '\\0';"},
{s:"Code: Security",q:"int compute_total(int *prices,\n                  int n) {\n    int total = 0;\n    for (int i = 0; i < n; i++) {\n        total += prices[i];\n    }\n    return total;\n}\n/* prices array has 100 elements,\n   n is received from network */",a:"BUG — No input validation on n:\nn comes from an untrusted source.\n\n1. Negative n: loop doesn't run, returns 0.\n2. n > 100: reads past the array — out-of-bounds read, information disclosure or crash.\n3. Integer overflow: large prices/n can overflow total.\n\nFIX:\n  #define MAX_PRICES 100\n  if (n < 0 || n > MAX_PRICES) return -1;\n  long long total = 0;\n  for (int i = 0; i < n; i++)\n      total += prices[i];\n  if (total > INT_MAX) return -1;\n  return (int)total;"},
{s:"Code: Tricky Patterns",q:"int arr[5] = {0};\nint *p = arr;\n\nfor (int i = 0; i < 5; i++) {\n    *(p++) = i * 10;\n}\n\n/* Questions:\n   What is *p after the loop?\n   What is arr[2]? */",a:"*p after the loop:\np has been incremented 5 times past arr[0], so p == &arr[5] (one past the end). *p is an out-of-bounds read — UNDEFINED BEHAVIOR.\n\narr[2]:\narr[2] = 20 (i=2: *(p++) = 2*10 = 20 → stored at arr[2] before p advances).\n\nPointing one-past-end is valid; dereferencing is not."},
{s:"Code: Tricky Patterns",q:"void mystery(char *s) {\n    while (*s) {\n        if (*s >= 'a' && *s <= 'z')\n            *s -= 32;\n        s++;\n    }\n}",a:"WHAT IT DOES:\nConverts a string to uppercase in-place (ASCII only). Subtracting 32 from a lowercase letter gives the uppercase value.\n\nISSUES:\n1. Only works for ASCII; not locale-aware. Use toupper((unsigned char)c) instead.\n2. Modifies string in place — will CRASH on a string literal (read-only).\n3. The magic number 32 is not self-documenting. Use 'a'-'A' or toupper()."},
{s:"Code: Tricky Patterns",q:"struct S { char a; int b;\n           char c; double d; };\nstruct T { int b; double d;\n           char a; char c; };\n\n/* What are sizeof(S) and\n   sizeof(T) on a 64-bit system? */",a:"sizeof(S): 24 bytes\n  char a (1) + 3pad + int b (4) + char c (1) + 7pad + double d (8) = 24\n\nsizeof(T): 24 bytes\n  int b (4) + 4pad + double d (8) + char a (1) + char c (1) + 6pad = 24\n\nOptimal reorder:\n  struct U { double d; int b; char a; char c; };\n  // 8 + 4 + 1 + 1 + 2pad = 16 bytes\n\nKEY LESSON: Order members largest-to-smallest to minimize padding."},
{s:"Code: Tricky Patterns",q:"void init(int *arr, size_t n) {\n    memset(arr, 1,\n           n * sizeof(int));\n}\n\n/* After init, what is arr[0]? */",a:"arr[0] is NOT 1.\n\nmemset sets each BYTE to 0x01. An int is 4 bytes, so arr[0] has bytes {0x01, 0x01, 0x01, 0x01} = 0x01010101 = 16843009.\n\nmemset(arr, 0, ...) and memset(arr, 0xFF, ...) give meaningful int values (0 and -1). Any other byte value is almost never what you want.\n\nFIX — Use a loop:\n  for (size_t i = 0; i < n; i++) arr[i] = 1;"},
{s:"Code: Tricky Patterns",q:"unsigned char a = 200;\nunsigned char b = 100;\nunsigned char c = a + b;\nint           d = a + b;\n\n/* What are c and d? */",a:"a + b:\nBoth promoted to int (integer promotion). int(200) + int(100) = 300.\n\nunsigned char c = 300:\n300 truncated to 8 bits: 300 - 256 = 44. c = 44.\n\nint d = 300:\nNo truncation. d = 300.\n\nKEY LESSON: Integer promotion saves the int; unsigned char truncates on assignment when value exceeds UCHAR_MAX (255)."},
{s:"Code: Tricky Patterns",q:"int arr[] = {10, 20, 30, 40, 50};\nprintf(\"%d\\n\", 2[arr]);",a:"ANSWER: Prints 30.\n\nIn C, a[i] is defined as *(a + i), which is commutative: *(2 + arr) == *(arr + 2) == arr[2] = 30.\n\nCompletely legal but intentionally confusing. You would never write this in production code."},
{s:"Code: Tricky Patterns",q:"int n = 0;\nif (n = 5)\n    printf(\"True\\n\");\nelse\n    printf(\"False\\n\");",a:"WHAT: This is ASSIGNMENT, not comparison.\n\nn = 5 assigns 5 to n and evaluates to 5 (non-zero → true). Output: \"True\".\n\nBUG (most likely): Programmer meant n == 5.\n\nGCC warns with -Wparentheses. Writing if ((n = 5)) silences the warning and signals intentional assignment."},
{s:"Code: Tricky Patterns",q:"size_t len = 0;\nif (len - 1 < 10) {\n    printf(\"small\\n\");\n}",a:"BUG — Unsigned underflow:\nlen is size_t (unsigned). len - 1 = 0 - 1 wraps to SIZE_MAX (18446744073709551615 on 64-bit).\n\nSIZE_MAX < 10 is FALSE. \"small\" is never printed.\n\nThis is a very common bug with size_t in loop termination.\n\nFIX:\n  if (len > 0 && len - 1 < 10) { ... }\n  // OR: if (len < 11) { ... }"},
{s:"Code: Tricky Patterns",q:"void *memdup(const void *src,\n             size_t n) {\n    void *dst = malloc(n);\n    if (dst) memcpy(dst, src, n);\n    return dst;\n}\n\n/* Is this correct? */",a:"ASSESSMENT — Correct and well-written:\n\n- Checks malloc return before use.\n- Returns NULL on allocation failure.\n- Works for any type (void*).\n- No UB.\n\nMINOR IMPROVEMENTS:\n1. If n == 0, malloc may return NULL or a unique pointer; memcpy with n==0 is safe. Consider: if (n == 0) return NULL;\n2. Document that caller must free().\n3. Could add: if (!src) return NULL;"},
{s:"Memory Functions",q:"What is mmap()? How does it differ from malloc() for large allocations?",a:"mmap() maps pages directly from the OS into the process's address space. malloc() uses a heap managed by the C runtime (which itself calls mmap or sbrk internally).\n\nFor large allocations, glibc's malloc actually uses mmap internally (threshold ~128 KB). Key differences:\n- mmap is page-aligned and page-granular (4 KB minimum).\n- mmap'd memory is returned to the OS on munmap; free'd heap memory may be retained by the allocator.\n- mmap has higher per-call overhead (syscall) but avoids fragmentation for large blocks."},
{s:"Memory Functions",q:"What is posix_memalign()? When would you use it instead of malloc()?",a:"posix_memalign(&ptr, alignment, size) allocates size bytes aligned to alignment (must be a power of 2 and a multiple of sizeof(void*)).\n\nUse cases:\n- SIMD instructions (SSE/AVX) requiring 16/32/64-byte alignment.\n- DMA buffers requiring page alignment.\n- Hardware that requires specific alignment for memory-mapped I/O.\n\nC11 alternative: aligned_alloc(alignment, size)."},
{s:"Memory Functions",q:"What happens when you call free() on a pointer not returned by malloc/calloc/realloc?",a:"Undefined behavior. The heap allocator's internal metadata (block headers, free-list pointers) will be corrupted because the pointer doesn't correspond to a valid allocation.\n\nCommon examples that cause this:\n- free(&stack_variable)\n- free(ptr + offset)  (pointer into the middle of a block)\n- free(string_literal)\n\nAll of these are UB and will likely crash or silently corrupt the heap."},
{s:"Memory Functions",q:"What is a memory pool / arena allocator? Why would you use one in C?",a:"A memory pool pre-allocates a large block and hands out fixed-size chunks from it. An arena allocates linearly (bump pointer) and frees everything at once.\n\nAdvantages:\n- O(1) allocation/deallocation (no free-list traversal).\n- Zero fragmentation within the pool.\n- Cache-friendly (allocations are contiguous).\n- Bulk free: destroy the entire arena in one call.\n\nUsed in: game engines, parsers, network servers, request-scoped allocations."},
{s:"Memory Functions",q:"What is the difference between stack allocation and heap allocation in terms of performance?",a:"Stack allocation: adjusting the stack pointer (one instruction, ~1 cycle). Deallocation is automatic on function return.\n\nHeap allocation: malloc traverses a free-list, may call sbrk/mmap (syscall). Orders of magnitude slower. free() must coalesce blocks.\n\nRule of thumb:\n- Stack for small, fixed-size, short-lived data.\n- Heap for large, variable-size, or long-lived data.\n- Stack is ~100-1000x faster for allocation itself."},
{s:"Pointers",q:"What is the difference between int (*p)[10] and int *p[10]?",a:"int (*p)[10]  — p is a POINTER TO an array of 10 ints.\n  p points to the whole array; *p is the array; (*p)[i] accesses elements.\n  sizeof(*p) = 40 (the whole array).\n\nint *p[10]   — p is an ARRAY OF 10 pointers to int.\n  p[i] is a pointer; *p[i] accesses the int it points to.\n  sizeof(p) = 80 (10 pointers on 64-bit)."},
{s:"Pointers",q:"Can you compare two pointers with < or > in C? What are the rules?",a:"Only if both pointers point into the SAME array (or one past the end). Comparing pointers to different objects is undefined behavior.\n\n  int a[10], b[10];\n  int *p = &a[3], *q = &a[7];\n  p < q   // OK, both in array a\n\n  int *r = &b[0];\n  p < r   // UNDEFINED BEHAVIOR\n\n== and != can compare any two pointers of compatible type (and can compare against NULL)."},
{s:"Pointers",q:"What is pointer decay? In what contexts does an array NOT decay to a pointer?",a:"Pointer decay: when an array name is used in an expression, it converts to a pointer to its first element.\n\nExceptions (array does NOT decay):\n1. sizeof(arr) — returns full array size, not pointer size.\n2. &arr — yields a pointer-to-array type, not pointer-to-element.\n3. String literal used to initialize char[] — the literal initializes the array, not a pointer.\n4. _Alignof(arr) — gives alignment of the array type."},
{s:"Pointers",q:"What is a callback function in C? How do you implement one?",a:"A callback is a function passed as an argument (via function pointer) to another function, to be called later.\n\n  typedef void (*Callback)(int result);\n\n  void do_work(int x, Callback on_done) {\n      int result = x * 2;\n      on_done(result);  // invoke callback\n  }\n\n  void my_handler(int r) {\n      printf(\"Result: %d\\n\", r);\n  }\n\n  do_work(21, my_handler);  // prints 42\n\nUsed in: qsort comparator, signal handlers, event-driven I/O, plugin systems."},
{s:"Concurrency",q:"What is a condition variable? How is it used with a mutex?",a:"A condition variable lets a thread sleep until a condition is signaled by another thread. Always used WITH a mutex:\n\n  pthread_mutex_lock(&mtx);\n  while (!condition)  // must be a WHILE loop (spurious wakeups)\n      pthread_cond_wait(&cond, &mtx);  // atomically unlocks mutex + sleeps\n  // condition is true, mutex is held\n  pthread_mutex_unlock(&mtx);\n\nSignaling thread:\n  pthread_mutex_lock(&mtx);\n  condition = true;\n  pthread_cond_signal(&cond);  // wake one waiter\n  pthread_mutex_unlock(&mtx);"},
{s:"Concurrency",q:"Why must you use a while loop (not if) when waiting on a condition variable?",a:"Spurious wakeups: pthread_cond_wait may return even when no signal was sent. The POSIX spec explicitly allows this.\n\nAlso: if multiple threads wait, pthread_cond_broadcast wakes ALL of them, but only one should proceed. The others must re-check the condition and go back to sleep.\n\n  // WRONG:\n  if (!ready) pthread_cond_wait(&cv, &mtx);\n\n  // CORRECT:\n  while (!ready) pthread_cond_wait(&cv, &mtx);"},
{s:"Concurrency",q:"What is a reader-writer lock? When would you use one instead of a mutex?",a:"A rwlock allows multiple concurrent readers OR one exclusive writer (but not both).\n\n  pthread_rwlock_rdlock(&rw);  // shared read\n  pthread_rwlock_wrlock(&rw);  // exclusive write\n\nUse when: reads vastly outnumber writes (e.g. a config table read by many threads, updated rarely). Readers don't block each other, so throughput is higher than a plain mutex.\n\nDownside: more overhead per lock/unlock than a mutex. If writes are frequent, a mutex may be faster."},
{s:"Concurrency",q:"What is thread-local storage (TLS)? How do you declare it in C?",a:"Thread-local storage gives each thread its own copy of a variable. One thread's writes don't affect another's copy.\n\nC11: _Thread_local int counter = 0;\nGCC:  __thread int counter = 0;\npthreads API: pthread_key_create / pthread_setspecific / pthread_getspecific\n\nUse cases: per-thread error codes (errno is thread-local), per-thread caches, per-thread allocators, re-entrant libraries."},
{s:"Concurrency",q:"What is the difference between pthread_cond_signal and pthread_cond_broadcast?",a:"pthread_cond_signal: wakes at least ONE waiting thread. Use when only one thread can make progress (e.g. one item added to a queue → one consumer).\n\npthread_cond_broadcast: wakes ALL waiting threads. Use when all waiters should re-evaluate (e.g. a shared condition changed that affects everyone, or when shutting down).\n\nBroadcast is always safe but less efficient. Signal is an optimization when you know only one waiter should proceed."},
{s:"Concurrency",q:"What is a semaphore? How does it differ from a mutex?",a:"A semaphore is a counter that threads can increment (sem_post) or decrement-and-wait (sem_wait). When the count is 0, sem_wait blocks.\n\nKey differences from a mutex:\n- A mutex is binary (locked/unlocked); a semaphore can count to N.\n- A mutex must be unlocked by the SAME thread that locked it; a semaphore can be posted by ANY thread.\n- A semaphore can synchronize between threads and processes.\n\nUse: limiting concurrency (max N connections), producer-consumer (counting items in queue)."},
{s:"Concurrency",q:"What is a memory barrier / memory fence? Why is it needed?",a:"A memory barrier is an instruction that prevents the CPU and compiler from reordering memory operations across it.\n\nNeeded because:\n1. Compilers reorder instructions for optimization.\n2. CPUs reorder loads and stores for performance (out-of-order execution, store buffers).\n\nWithout barriers, Thread A's write may not be visible to Thread B even after synchronization appears complete in source code.\n\nC11 atomics include memory ordering: memory_order_acquire, memory_order_release, memory_order_seq_cst. Mutexes implicitly include full barriers."},
{s:"Concurrency",q:"What is the difference between volatile and _Atomic in C?",a:"volatile: tells the compiler not to cache the variable in a register. Does NOT guarantee atomicity, does NOT prevent CPU reordering, does NOT prevent data races. Not sufficient for thread synchronization.\n\n_Atomic (C11): guarantees indivisible read/write, prevents torn reads, enforces memory ordering between threads. IS sufficient for thread synchronization on simple operations.\n\nUse volatile for: hardware registers, signal handlers.\nUse _Atomic for: inter-thread communication."},
{s:"Concurrency",q:"What is fork() vs creating a thread? When would you choose each?",a:"fork(): creates a NEW PROCESS with a copy of the entire address space. Separate memory, file descriptors are duplicated.\n- Advantage: complete isolation (crash in child doesn't kill parent).\n- Disadvantage: heavy (copy-on-write helps but still expensive), IPC needed to communicate.\n\nThreads: share the same address space, file descriptors, heap.\n- Advantage: lightweight creation, easy data sharing.\n- Disadvantage: one thread's bug can corrupt all threads; synchronization required.\n\nChoose fork for: isolation, running external programs (exec). Choose threads for: shared-memory parallelism, I/O concurrency."},
{s:"Concurrency",q:"What is pthread_join()? What happens if you don't join or detach a thread?",a:"pthread_join(tid, &retval) blocks the caller until thread tid exits, then retrieves its return value and frees its resources.\n\nIf you neither join nor detach: the thread's resources (stack, thread ID) are never freed — a resource leak (zombie thread). Accumulating these can eventually exhaust thread limits.\n\npthread_detach(tid): marks the thread so its resources are automatically freed on exit. Use when you don't need the return value.\n\nRule: every thread must be either joined or detached."},
{s:"Sockets & Networking",q:"What is the socket lifecycle for a TCP server? List the system calls in order.",a:"1. socket()   — create a socket file descriptor.\n2. bind()     — bind to an address (IP + port).\n3. listen()   — mark as passive (accepting connections); set backlog.\n4. accept()   — block until a client connects; returns a NEW fd for that connection.\n5. recv()/send() — read/write data on the connection fd.\n6. close()    — close the connection fd (and eventually the listening fd).\n\nClient side: socket() → connect() → send()/recv() → close()."},
{s:"Sockets & Networking",q:"What is the difference between TCP and UDP?",a:"TCP (Transmission Control Protocol):\n- Connection-oriented (3-way handshake).\n- Reliable, ordered delivery. Retransmits lost packets.\n- Stream-based (no message boundaries).\n- Higher overhead (connection state, ACKs).\n\nUDP (User Datagram Protocol):\n- Connectionless (no handshake).\n- Unreliable: packets can be lost, duplicated, reordered.\n- Message-based (preserves boundaries).\n- Lower overhead, lower latency.\n\nTCP for: HTTP, SSH, database connections. UDP for: DNS, video streaming, gaming."},
{s:"Sockets & Networking",q:"What is the purpose of htonl(), htons(), ntohl(), ntohs()?",a:"These convert between host byte order and network byte order:\n- htonl: host to network, 32-bit (for IP addresses).\n- htons: host to network, 16-bit (for port numbers).\n- ntohl / ntohs: network to host.\n\nNetwork byte order is always big-endian (most significant byte first). x86 is little-endian. Without conversion, a port number 80 (0x0050) would be sent as 0x5000 (20480) on x86.\n\nAlways use these when filling sockaddr_in fields."},
{s:"Sockets & Networking",q:"What is SO_REUSEADDR? Why is it almost always needed on server sockets?",a:"setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof(yes));\n\nAllows binding to a port that is in the TIME_WAIT state (from a recently closed connection). Without it, restarting a server immediately after stopping it fails with 'Address already in use' because the OS holds the port in TIME_WAIT for ~60 seconds.\n\nAlso allows multiple sockets to bind to the same port if they bind to different addresses."},
{s:"Sockets & Networking",q:"What is select() / poll() / epoll()? Why would you use them?",a:"All are I/O multiplexing mechanisms — they let one thread monitor MULTIPLE file descriptors for readiness.\n\nselect(): oldest, portable. Limited to FD_SETSIZE (typically 1024) descriptors. O(n) per call.\n\npoll(): no fd limit. Still O(n) per call (scans entire array).\n\nepoll() (Linux-specific): O(1) for ready events. Scales to millions of connections. Used by nginx, Node.js, etc.\n\nUse case: a server handling thousands of connections without one-thread-per-connection."},
{s:"Sockets & Networking",q:"Why must you handle partial sends and receives with TCP sockets?",a:"TCP is a STREAM protocol — send() and recv() may transfer fewer bytes than requested:\n\n- send(fd, buf, 1000, 0) may return 500 (kernel buffer full).\n- recv(fd, buf, 1000, 0) may return 100 (only 100 bytes available so far).\n\nYou MUST loop:\n  size_t total = 0;\n  while (total < len) {\n      ssize_t n = send(fd, buf+total, len-total, 0);\n      if (n <= 0) { /* handle error/close */ break; }\n      total += n;\n  }\n\nThis is NOT needed for UDP (datagrams are atomic)."},
{s:"Sockets & Networking",q:"What is the difference between blocking and non-blocking sockets?",a:"Blocking (default): recv() blocks until data arrives. accept() blocks until a connection arrives. Can hang the thread.\n\nNon-blocking: recv()/accept() return immediately with EAGAIN/EWOULDBLOCK if no data/connection is ready. The application must poll or use select/epoll.\n\nSet non-blocking:\n  int flags = fcntl(fd, F_GETFL, 0);\n  fcntl(fd, F_SETFL, flags | O_NONBLOCK);\n\nNon-blocking + epoll is the standard pattern for high-performance servers."},
{s:"Sockets & Networking",q:"What is a sockaddr_in structure? What fields does it contain?",a:"struct sockaddr_in {\n    sa_family_t    sin_family;  // AF_INET\n    in_port_t      sin_port;    // port (network byte order)\n    struct in_addr sin_addr;    // IP (network byte order)\n    char           sin_zero[8]; // padding\n};\n\nUsage:\n  struct sockaddr_in addr;\n  addr.sin_family = AF_INET;\n  addr.sin_port = htons(8080);\n  addr.sin_addr.s_addr = INADDR_ANY;  // bind to all interfaces\n\nCast to (struct sockaddr*) when passing to bind/connect/accept."},
{s:"Sockets & Networking",q:"What does the listen() backlog parameter mean?",a:"listen(fd, backlog) marks the socket as passive and sets the maximum length of the queue of PENDING connections — connections that have completed the TCP 3-way handshake but haven't been accept()ed yet.\n\nIf the queue is full, new connection attempts get ECONNREFUSED (or silently dropped, depending on OS).\n\nTypical values: 5 for small servers, 128 or SOMAXCONN for production servers. The OS may cap it (Linux: net.core.somaxconn, default 4096 on modern kernels)."},
{s:"SQL & Databases",q:"What are the four types of SQL JOINs? Explain each.",a:"INNER JOIN: returns only rows with matching keys in BOTH tables.\n\nLEFT (OUTER) JOIN: returns all rows from the left table + matching rows from the right. Non-matching right columns are NULL.\n\nRIGHT (OUTER) JOIN: opposite of LEFT — all rows from the right table.\n\nFULL (OUTER) JOIN: returns all rows from both tables. Non-matching sides are NULL.\n\nAlso: CROSS JOIN — Cartesian product (every row × every row). No ON clause."},
{s:"SQL & Databases",q:"What is the difference between WHERE and HAVING in SQL?",a:"WHERE filters rows BEFORE grouping (operates on individual rows).\nHAVING filters groups AFTER GROUP BY (operates on aggregated results).\n\n  SELECT dept, COUNT(*) as cnt\n  FROM employees\n  WHERE salary > 50000       -- filter individual rows first\n  GROUP BY dept\n  HAVING COUNT(*) > 5;       -- then filter groups\n\nYou cannot use aggregate functions (COUNT, SUM, AVG) in WHERE — only in HAVING."},
{s:"SQL & Databases",q:"What are ACID properties of a database transaction?",a:"Atomicity: a transaction is all-or-nothing. If any part fails, the entire transaction is rolled back.\n\nConsistency: a transaction moves the database from one valid state to another. Constraints are never violated.\n\nIsolation: concurrent transactions behave as if they ran serially. Levels: READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE.\n\nDurability: once committed, the data survives crashes (written to non-volatile storage / WAL)."},
{s:"SQL & Databases",q:"What is a prepared statement? Why should you always use them?",a:"A prepared statement separates SQL structure from data:\n\n  PREPARE stmt FROM 'SELECT * FROM users WHERE id = ?';\n  EXECUTE stmt USING @user_id;\n\nBenefits:\n1. SQL injection prevention — parameters are never interpolated into the query string; they're sent as typed data.\n2. Performance — the DB parses and plans the query once, then reuses the plan for different parameter values.\n3. Correctness — no need to manually escape quotes or special characters."},
{s:"SQL & Databases",q:"What is ODBC? What is its architecture?",a:"ODBC (Open Database Connectivity) is a standard C API for accessing databases regardless of the DBMS.\n\nArchitecture (3 layers):\n1. Application — calls ODBC functions (SQLConnect, SQLExecDirect, etc.).\n2. Driver Manager — loads the correct driver based on the DSN (Data Source Name), routes calls.\n3. Driver — translates ODBC calls into the database's native protocol (e.g., PostgreSQL wire protocol, Oracle OCI).\n\nA DSN specifies: driver, server, database, credentials. Configured in odbc.ini (Linux) or ODBC Data Source Administrator (Windows)."},
{s:"SQL & Databases",q:"What is JDBC? How does it compare to ODBC?",a:"JDBC (Java Database Connectivity) is Java's standard API for database access.\n\nSimilarities to ODBC:\n- Same concept: abstract API → driver → database.\n- Uses connection strings and drivers.\n\nDifferences:\n- JDBC is Java-only; ODBC is C-based (usable from many languages).\n- JDBC drivers are Java classes loaded at runtime; ODBC drivers are native shared libraries.\n- JDBC has 4 driver types (Type 1 = JDBC-ODBC bridge, Type 4 = pure Java, most common).\n\nJDBC connection:\n  Connection conn = DriverManager.getConnection(url, user, pass);"},
{s:"SQL & Databases",q:"What are SQL transaction isolation levels? What problems does each prevent?",a:"READ UNCOMMITTED: sees uncommitted data from other transactions (dirty reads). Fastest, least safe.\n\nREAD COMMITTED: only sees committed data. Prevents dirty reads. Default in PostgreSQL, Oracle.\n\nREPEATABLE READ: same query in a transaction returns the same rows. Prevents dirty reads + non-repeatable reads. Default in MySQL/InnoDB.\n\nSERIALIZABLE: transactions behave as if executed serially. Prevents all anomalies (including phantom reads). Slowest.\n\nPhantom read: a query returns different ROWS when re-executed (another transaction inserted/deleted)."},
{s:"SQL & Databases",q:"What is an SQL index? When should you add one and when not?",a:"An index is a data structure (usually B-tree) that speeds up lookups on a column.\n\nAdd an index when:\n- Column is used frequently in WHERE, JOIN, or ORDER BY.\n- Column has high cardinality (many distinct values).\n- Table is large and queries are slow.\n\nDon't add when:\n- Table is small (full scan is fast enough).\n- Column is written far more often than read (indexes slow down INSERT/UPDATE/DELETE).\n- Column has low cardinality (e.g., boolean — index won't help much).\n\nPrimary keys are automatically indexed."},
{s:"SQL & Databases",q:"What is connection pooling? Why is it important?",a:"Connection pooling reuses a fixed set of database connections instead of opening/closing one per request.\n\nWhy it matters:\n- Opening a DB connection is expensive (~10-100ms: TCP handshake, TLS, authentication, session setup).\n- A pool opens N connections at startup and hands them out on demand.\n- When a request finishes, the connection goes back to the pool (not closed).\n\nTypical pool sizes: 10-50 connections per application instance. Sized based on DB's max_connections and expected concurrency."},
{s:"TLS & Security",q:"What is TLS? How does the TLS handshake work at a high level?",a:"TLS (Transport Layer Security) encrypts communication between a client and server.\n\nTLS 1.2 handshake (simplified):\n1. ClientHello — client sends supported cipher suites, TLS version, random nonce.\n2. ServerHello — server picks a cipher suite, sends its certificate.\n3. Client verifies certificate against trusted CAs.\n4. Key exchange — client and server derive a shared secret (e.g., via ECDHE).\n5. Both sides derive symmetric session keys from the shared secret.\n6. Encrypted communication begins.\n\nTLS 1.3 reduces this to 1 round-trip (1-RTT) by combining steps."},
{s:"TLS & Security",q:"What is the difference between symmetric and asymmetric encryption?",a:"Symmetric: same key encrypts and decrypts. Fast (AES-256: ~GBps). Problem: both parties must share the key securely.\n\nAsymmetric: public key encrypts, private key decrypts (or vice versa for signing). Slow (~1000x slower). Solves key distribution: the public key can be shared openly.\n\nTLS uses BOTH:\n- Asymmetric (RSA/ECDHE) during handshake to securely exchange a symmetric key.\n- Symmetric (AES-GCM) for bulk data encryption afterward.\n\nThis is called hybrid encryption."},
{s:"TLS & Security",q:"What is a certificate chain of trust? What is a CA?",a:"A CA (Certificate Authority) is a trusted entity that signs certificates.\n\nChain of trust:\n1. Root CA — self-signed, pre-installed in browsers/OS trust stores. (e.g., DigiCert, Let's Encrypt's ISRG Root).\n2. Intermediate CA — signed by the root CA. Signs leaf certificates.\n3. Leaf certificate — the server's certificate, signed by the intermediate.\n\nVerification: client checks that the leaf cert is signed by an intermediate, which is signed by a trusted root. If any link is broken or expired, the connection is rejected."},
{s:"TLS & Security",q:"What is mutual TLS (mTLS)? When is it used?",a:"In standard TLS, only the SERVER presents a certificate. The client verifies the server but the server doesn't verify the client.\n\nIn mTLS, BOTH sides present certificates:\n1. Server sends its cert → client verifies.\n2. Client sends its cert → server verifies.\n\nUse cases:\n- Service-to-service authentication in microservices (Kubernetes service mesh, Istio).\n- Zero-trust networking.\n- API authentication (instead of API keys).\n- IoT device authentication."},
{s:"TLS & Security",q:"What is the difference between TLS 1.2 and TLS 1.3?",a:"TLS 1.3 improvements:\n- Faster handshake: 1-RTT instead of 2-RTT. Supports 0-RTT resumption.\n- Removed insecure algorithms: no RSA key exchange, no CBC, no RC4, no SHA-1, no static DH.\n- Simpler cipher suite negotiation (only 5 suites vs dozens).\n- Encrypted more of the handshake (certificate is now encrypted).\n- Mandatory forward secrecy (ECDHE only).\n\nTLS 1.0 and 1.1 are deprecated. TLS 1.2 is still widely used. TLS 1.3 is preferred."},
{s:"TLS & Security",q:"What is certificate pinning? What are its pros and cons?",a:"Certificate pinning: the application hardcodes which certificate (or public key) it expects from a server, instead of trusting any CA-signed cert.\n\nPros:\n- Prevents attacks where an attacker obtains a fraudulent cert from a compromised CA.\n- Stronger security for critical connections.\n\nCons:\n- Painful certificate rotation — must update and deploy the application when the cert changes.\n- Can brick the app if the pinned cert expires and the app hasn't been updated.\n\nCommonly used in mobile apps for API servers. Less common in browsers (deprecated in Chrome)."},
{s:"TLS & Security",q:"What is forward secrecy? Why does it matter?",a:"Forward secrecy (Perfect Forward Secrecy / PFS): even if the server's private key is later compromised, past recorded sessions cannot be decrypted.\n\nAchieved by: using ephemeral key exchange (ECDHE). Each session generates a unique shared secret that is discarded after use. The server's private key is only used for authentication (signing), not for deriving the session key.\n\nWithout PFS (static RSA key exchange): an attacker who records traffic and later obtains the private key can decrypt ALL past sessions. This is why TLS 1.3 mandates ECDHE."},
{s:"Kubernetes",q:"What is Kubernetes? What problem does it solve?",a:"Kubernetes (K8s) is a container orchestration platform. It automates deployment, scaling, and management of containerized applications.\n\nProblems it solves:\n- Scheduling: decides which machine runs which container.\n- Scaling: automatically adds/removes container replicas based on load.\n- Self-healing: restarts crashed containers, replaces unhealthy nodes.\n- Service discovery: containers find each other by name, not IP.\n- Rolling updates: deploy new versions with zero downtime.\n- Configuration management: inject config and secrets into containers."},
{s:"Kubernetes",q:"What is a Pod? Why is it the smallest deployable unit (not a container)?",a:"A Pod is one or more containers that share:\n- Network namespace (same IP address, can communicate via localhost).\n- Storage volumes.\n- Lifecycle (started/stopped together).\n\nWhy not just a container? Some workloads need tightly-coupled containers:\n- Sidecar pattern: main app + log collector, or main app + TLS proxy (Envoy).\n- Init containers: run setup tasks before the main container starts.\n\nMost pods have exactly one container. Multi-container pods are for patterns that require co-location."},
{s:"Kubernetes",q:"What is a Deployment? How does it differ from a Pod?",a:"A Deployment is a higher-level resource that manages Pods:\n- Declares the DESIRED state (image, replicas, resource limits).\n- Creates a ReplicaSet that ensures the right number of Pods are running.\n- Handles rolling updates and rollbacks.\n\nYou almost never create Pods directly. You create a Deployment, and it creates the Pods for you. If a Pod crashes, the Deployment/ReplicaSet replaces it automatically.\n\n  kubectl create deployment myapp --image=myapp:v2 --replicas=3"},
{s:"Kubernetes",q:"What is a Service in Kubernetes? What are the main types?",a:"A Service provides stable networking for a set of Pods (which have ephemeral IPs).\n\nTypes:\n- ClusterIP (default): internal-only virtual IP. Other pods access it by name (DNS).\n- NodePort: exposes the service on a static port on every node's IP. External access via <NodeIP>:<NodePort>.\n- LoadBalancer: provisions a cloud load balancer (AWS ELB, GCP LB) pointing to the service.\n- ExternalName: maps to an external DNS name (CNAME).\n\nServices use label selectors to route traffic to the right Pods."},
{s:"Kubernetes",q:"What are ConfigMaps and Secrets? How do they differ?",a:"ConfigMaps: store non-sensitive configuration as key-value pairs. Injected into Pods as environment variables or mounted as files.\n\nSecrets: store sensitive data (passwords, API keys, TLS certs). Base64-encoded (NOT encrypted by default — enable encryption at rest). Injected the same way as ConfigMaps.\n\nKey difference: Secrets are treated specially by K8s — access can be restricted via RBAC, they are stored in tmpfs (not written to disk on nodes), and they are not logged.\n\nBoth decouple configuration from container images."},
{s:"Kubernetes",q:"What are liveness and readiness probes?",a:"Liveness probe: 'Is the container still alive?'\n- If it fails, K8s RESTARTS the container.\n- Detects: deadlocks, hung processes, unresponsive apps.\n\nReadiness probe: 'Is the container ready to receive traffic?'\n- If it fails, K8s REMOVES the pod from the Service's endpoints (stops sending traffic).\n- Detects: app still loading, dependency not available.\n\nProbe types: HTTP GET, TCP socket, or exec command.\n\nExample:\n  livenessProbe:\n    httpGet:\n      path: /healthz\n      port: 8080\n    initialDelaySeconds: 10\n    periodSeconds: 5"},
{s:"Kubernetes",q:"What is a Namespace in Kubernetes?",a:"A Namespace is a virtual cluster within a physical cluster. It provides:\n- Isolation: resources in different namespaces don't collide (two services can have the same name in different namespaces).\n- Access control: RBAC policies can be scoped to a namespace.\n- Resource quotas: limit CPU/memory per namespace.\n\nDefault namespaces:\n- default: where resources go if no namespace is specified.\n- kube-system: K8s internal components.\n- kube-public: readable by all users.\n\nUse namespaces to separate: dev/staging/prod, or team-a/team-b."},
{s:"Kubernetes",q:"What does kubectl get pods and kubectl describe pod do?",a:"kubectl get pods:\n  Lists all pods in the current namespace with: NAME, READY, STATUS, RESTARTS, AGE.\n  Quick overview. Add -o wide for node/IP info, -o yaml for full spec.\n\nkubectl describe pod <name>:\n  Detailed view: events, conditions, container statuses, resource requests/limits, volumes, node assignment, restart reasons.\n  The EVENTS section at the bottom is the most useful for debugging (shows scheduling, pulling, starting, crashing)."},
{s:"Code: Memory & Pointers",q:"char *name = malloc(strlen(input));\nstrcpy(name, input);",a:"BUG — Off-by-one on malloc size:\nstrlen(input) returns the length WITHOUT the null terminator. malloc(strlen(input)) allocates one byte too few. strcpy copies the '\\0', writing one byte past the allocation — heap overflow.\n\nFIX:\n  char *name = malloc(strlen(input) + 1);\n  if (!name) return NULL;\n  strcpy(name, input);\n\n  // Or simply: char *name = strdup(input);"},
{s:"Code: Memory & Pointers",q:"int *p = realloc(p, new_size);\nif (!p) {\n    fprintf(stderr, \"OOM\\n\");\n    exit(1);\n}",a:"BUG — Assigning realloc result to the same pointer:\nIf realloc fails and returns NULL, the ORIGINAL pointer is overwritten — it's now lost. The previously allocated memory is leaked and unrecoverable.\n\nFIX — Use a temporary pointer:\n  int *tmp = realloc(p, new_size);\n  if (!tmp) {\n      free(p);  // can still free original\n      exit(1);\n  }\n  p = tmp;"},
{s:"Code: Concurrency",q:"void *producer(void *arg) {\n    pthread_mutex_lock(&mtx);\n    enqueue(data);\n    pthread_cond_signal(&cond);\n    pthread_mutex_unlock(&mtx);\n}\n\nvoid *consumer(void *arg) {\n    pthread_mutex_lock(&mtx);\n    if (queue_empty())\n        pthread_cond_wait(&cond, &mtx);\n    item = dequeue();\n    pthread_mutex_unlock(&mtx);\n}",a:"BUG — Uses 'if' instead of 'while' for condition wait:\nSpurious wakeups can cause pthread_cond_wait to return even when no signal was sent. The consumer dequeues from an empty queue — UB or crash.\n\nAlso: if multiple consumers exist, one may consume the item before another wakes up.\n\nFIX:\n  while (queue_empty())  // WHILE, not IF\n      pthread_cond_wait(&cond, &mtx);"},
{s:"Code: Concurrency",q:"void *worker(void *arg) {\n    while (1) {\n        pthread_mutex_lock(&mtx);\n        if (shutdown_flag) {\n            return NULL;  // BUG\n        }\n        do_work();\n        pthread_mutex_unlock(&mtx);\n    }\n}",a:"BUG — Returns while holding the mutex:\nIf shutdown_flag is true, the function returns NULL without calling pthread_mutex_unlock. The mutex is permanently locked — all other threads waiting on it will deadlock.\n\nFIX:\n  if (shutdown_flag) {\n      pthread_mutex_unlock(&mtx);  // unlock BEFORE return\n      return NULL;\n  }\n\nBetter pattern: use pthread_cleanup_push to guarantee unlock even on cancellation."},
{s:"Code: Concurrency",q:"pthread_t t;\npthread_create(&t, NULL,\n               worker, NULL);\n/* ... main continues ... */\nprintf(\"Done\\n\");\nreturn 0;",a:"BUGS:\n\n1. Thread not joined or detached — resource leak (zombie thread). The thread's stack and metadata are never freed.\n\n2. main() may exit before the thread finishes — the entire process is terminated, killing the thread mid-execution. Any cleanup (flushing files, freeing resources) in the thread is skipped.\n\nFIX:\n  pthread_join(t, NULL);  // wait for thread\n  printf(\"Done\\n\");\n  return 0;\n\n  // OR: pthread_detach(t); if you don't need the result."},
{s:"Code: Sockets",q:"int fd = socket(AF_INET, SOCK_STREAM, 0);\nstruct sockaddr_in addr;\naddr.sin_family = AF_INET;\naddr.sin_port = 8080;\naddr.sin_addr.s_addr = INADDR_ANY;\nbind(fd, (struct sockaddr*)&addr,\n     sizeof(addr));\nlisten(fd, 5);\nint client = accept(fd, NULL, NULL);",a:"BUGS:\n\n1. Port not in network byte order — addr.sin_port = 8080 stores 8080 in host byte order. On little-endian x86, this becomes port 36895 on the wire.\n   FIX: addr.sin_port = htons(8080);\n\n2. addr not zeroed — sin_zero and other padding may contain garbage, causing bind to fail or behave unpredictably.\n   FIX: memset(&addr, 0, sizeof(addr));\n\n3. No SO_REUSEADDR — server restart will fail with EADDRINUSE.\n\n4. No error checking on socket/bind/listen/accept."},
{s:"Code: Sockets",q:"char buf[1024];\nint n = recv(fd, buf, sizeof(buf), 0);\nprintf(\"Received: %s\\n\", buf);",a:"BUGS:\n\n1. recv does not null-terminate — buf is not a C string. printf(\"%s\", buf) reads until it finds a '\\0' somewhere in memory — buffer over-read, possibly printing garbage or crashing.\n\n2. n not checked — recv returns -1 on error, 0 on connection close. Using buf without checking n is UB.\n\n3. Even with null-termination, recv may return a partial message (TCP is a stream).\n\nFIX:\n  int n = recv(fd, buf, sizeof(buf)-1, 0);\n  if (n <= 0) { /* handle */ return; }\n  buf[n] = '\\0';  // now it's a string"},
{s:"Code: Sockets",q:"void send_all(int fd,\n              const char *buf,\n              size_t len) {\n    send(fd, buf, len, 0);\n}",a:"BUG — Ignores partial sends:\nTCP send() may send fewer bytes than requested (kernel buffer full). This silently drops the remaining data.\n\nAlso: send() return value not checked for errors (-1).\n\nFIX — Loop until all bytes are sent:\n  ssize_t send_all(int fd, const char *buf,\n                   size_t len) {\n      size_t total = 0;\n      while (total < len) {\n          ssize_t n = send(fd, buf+total,\n                          len-total, 0);\n          if (n <= 0) return -1;\n          total += n;\n      }\n      return total;\n  }"},
{s:"Code: Sockets",q:"/* Simple TCP server */\nwhile (1) {\n    int client = accept(listen_fd,\n                        NULL, NULL);\n    handle_client(client);\n    close(client);\n}",a:"ISSUE — Single-threaded, blocking:\nhandle_client blocks the entire server. While serving one client, all other connections queue up in the listen backlog. If handle_client takes a long time, clients time out.\n\nThis is correct but not scalable.\n\nIMPROVEMENTS (pick one):\n1. Fork per connection: fork() after accept, handle in child.\n2. Thread per connection: pthread_create per client.\n3. Thread pool: fixed N workers, dispatch via queue.\n4. Non-blocking + epoll: single-threaded event loop (most scalable)."},
{s:"Code: SQL",q:"char query[512];\nsprintf(query,\n  \"SELECT * FROM users \"\n  \"WHERE name = '%s'\",\n  user_input);\ndb_execute(query);",a:"BUG — SQL injection:\nIf user_input is:  ' OR '1'='1\nThe query becomes:\n  SELECT * FROM users WHERE name = '' OR '1'='1'\nThis matches ALL rows — authentication bypass, data exfiltration.\n\nAlso: sprintf can overflow query for long input.\n\nFIX — Use prepared statements / parameterized queries:\n  db_prepare(\"SELECT * FROM users WHERE name = ?\");\n  db_bind_param(1, user_input);\n  db_execute();\n\nNEVER interpolate user input into SQL strings."},
{s:"Code: SQL",q:"SELECT name, COUNT(*)\nFROM orders\nWHERE COUNT(*) > 5\nGROUP BY name;",a:"BUG — Cannot use aggregate in WHERE:\nWHERE filters rows BEFORE grouping. COUNT(*) isn't available yet at that stage.\n\nFIX — Use HAVING:\n  SELECT name, COUNT(*)\n  FROM orders\n  GROUP BY name\n  HAVING COUNT(*) > 5;\n\nExecution order:\n  FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\n\nHAVING operates on groups (after GROUP BY), which is when aggregates are available."},
{s:"Sockets & Networking",q:"What happens if you forget to close() a socket file descriptor? How do you prevent fd leaks in C?",a:"Each open socket consumes a file descriptor. The OS has a per-process fd limit (typically 1024 default, tunable with ulimit -n). Leaked fds accumulate until:\n- New socket/open calls fail with EMFILE ('too many open files').\n- The server can no longer accept connections.\n\nPrevention patterns:\n1. Always close(fd) in every code path (including error paths).\n2. Use goto-based cleanup in C:\n     if (error) goto cleanup;\n     ...\n   cleanup:\n     if (fd >= 0) close(fd);\n3. In forked servers: close the listening fd in the child, close the client fd in the parent.\n4. Use shutdown(fd, SHUT_RDWR) before close() for graceful TCP teardown."},
{s:"Sockets & Networking",q:"What is the difference between close() and shutdown() on a socket?",a:"close(fd): decrements the fd's reference count. When it reaches 0, the socket is fully closed. Pending data may be discarded or sent depending on SO_LINGER.\n\nshutdown(fd, how): partially closes the connection:\n  SHUT_RD   — no more reads (peer's sends will get RST).\n  SHUT_WR   — no more writes (sends FIN to peer, signals EOF).\n  SHUT_RDWR — both (like close but doesn't free the fd).\n\nKey difference: shutdown affects the CONNECTION (shared by dup'd fds). close affects only THIS fd. After fork(), shutdown in one process affects both; close only affects the caller's fd.\n\nPattern: shutdown(fd, SHUT_WR) to signal 'I'm done sending' while still reading the peer's response, then close(fd)."},
{s:"TLS & Security",q:"What steps does a TLS client perform to validate a server's certificate?",a:"1. Check expiration: is the cert's notBefore/notAfter range valid right now?\n2. Verify signature chain: leaf cert signed by intermediate, intermediate signed by trusted root CA. Every signature is cryptographically verified.\n3. Check revocation: is the cert revoked? Via CRL (Certificate Revocation List) or OCSP (Online Certificate Status Protocol).\n4. Hostname verification: does the cert's Subject Alternative Name (SAN) or Common Name (CN) match the hostname the client connected to?\n5. Key usage: does the cert's keyUsage extension permit the operation (e.g., digital signature, key encipherment)?\n\nIf ANY step fails, the connection must be rejected. Skipping hostname verification is a common and critical vulnerability."},
{s:"TLS & Security",q:"What are common TLS certificate validation errors and what causes them?",a:"CERTIFICATE_EXPIRED: cert's notAfter date has passed. Fix: renew the cert.\n\nUNKNOWN_CA / UNABLE_TO_GET_ISSUER_CERT: the signing CA isn't in the client's trust store. Cause: missing intermediate cert in the server's chain, or self-signed cert.\n\nHOSTNAME_MISMATCH: the domain in the URL doesn't match any SAN or CN in the cert. Cause: wrong cert installed, or accessing via IP instead of hostname.\n\nSELF_SIGNED_CERTIFICATE: the cert is not signed by a trusted CA. Acceptable in dev (with explicit trust), never in production.\n\nCERTIFICATE_REVOKED: cert was revoked by the CA (compromised key, mis-issuance)."},
{s:"Networking & Firewalls",q:"What is NAT? How does it affect socket connections?",a:"NAT (Network Address Translation) maps private IPs (10.x, 192.168.x) to public IPs at the router.\n\nOutbound connections (client behind NAT): work fine. The router creates a mapping (private IP:port → public IP:port) and translates packets in both directions.\n\nInbound connections (server behind NAT): fail by default. No mapping exists for unsolicited inbound packets. Solutions:\n- Port forwarding: router maps public_ip:port → private_ip:port.\n- UPnP/NAT-PMP: application asks the router to create a mapping.\n- NAT traversal (STUN/TURN): used in P2P (WebRTC, VoIP)."},
{s:"Networking & Firewalls",q:"What is a firewall? What are the common types of firewall rules relevant to socket programming?",a:"A firewall filters network traffic based on rules. Relevant rule types:\n\n1. Port-based: allow/deny traffic on specific ports.\n   e.g., allow inbound TCP port 443 (HTTPS), block all others.\n\n2. Direction: inbound (incoming connections) vs outbound (outgoing).\n   Servers need inbound rules; clients usually only need outbound.\n\n3. Protocol: TCP vs UDP vs ICMP.\n\n4. Source/destination IP: restrict access to specific IPs or ranges.\n\nCommon issues in development:\n- 'Connection refused' → port not open in firewall (or server not running).\n- 'Connection timed out' → firewall silently drops packets (no RST sent).\n- iptables (Linux), Security Groups (AWS), NSGs (Azure)."},
{s:"Networking & Firewalls",q:"What is the difference between 'connection refused' and 'connection timed out'?",a:"Connection refused (ECONNREFUSED):\n- The target machine received the SYN packet and actively rejected it (sent RST).\n- Cause: no process is listening on that port, or a firewall explicitly rejects.\n- Fast failure (immediate RST).\n\nConnection timed out (ETIMEDOUT):\n- The SYN packet was sent but no response came (no SYN-ACK, no RST).\n- Cause: firewall silently drops packets, host is down, or network is unreachable.\n- Slow failure (waits for the TCP retransmit timeout, typically 20-120 seconds).\n\nDebugging: 'refused' means the host is reachable but the port is wrong. 'Timed out' means the packet never arrived or was dropped."},
{s:"Sockets & Networking",q:"How do you set send and receive timeouts on a socket in C?",a:"Use setsockopt with SO_RCVTIMEO and SO_SNDTIMEO:\n\n  struct timeval tv;\n  tv.tv_sec = 5;   // 5-second timeout\n  tv.tv_usec = 0;\n  setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO,\n             &tv, sizeof(tv));\n  setsockopt(fd, SOL_SOCKET, SO_SNDTIMEO,\n             &tv, sizeof(tv));\n\nAfter setting: recv()/send() return -1 with errno = EAGAIN or EWOULDBLOCK if the timeout expires.\n\nAlternative: use select()/poll() with a timeout parameter for finer control (can multiplex multiple fds)."},
{s:"Sockets & Networking",q:"How do you implement a connect() timeout for a TCP client?",a:"connect() on a blocking socket can hang for 60-120 seconds if the server is unreachable. Fix:\n\n1. Set socket to non-blocking:\n   fcntl(fd, F_SETFL, O_NONBLOCK);\n\n2. Call connect() — it returns immediately with EINPROGRESS.\n\n3. Use select() or poll() with your desired timeout:\n   fd_set wfds;\n   FD_SET(fd, &wfds);\n   struct timeval tv = {5, 0};  // 5 sec\n   int ret = select(fd+1, NULL, &wfds, NULL, &tv);\n\n4. If select returns 0: timeout — close(fd) and report error.\n   If select returns > 0: check getsockopt(fd, SOL_SOCKET, SO_ERROR, ...) to verify the connection succeeded.\n\n5. Set socket back to blocking if needed."},
{s:"Sockets & Networking",q:"What is TCP keepalive? When should you enable it?",a:"TCP keepalive sends periodic probe packets on idle connections to detect dead peers.\n\nWithout keepalive: if a peer crashes (no FIN sent), the local side never knows the connection is dead — it hangs forever on the next recv().\n\nEnable:\n  int yes = 1;\n  setsockopt(fd, SOL_SOCKET, SO_KEEPALIVE, &yes, sizeof(yes));\n\nLinux tuning (per-socket or system-wide):\n  TCP_KEEPIDLE  — seconds before first probe (default 7200 = 2 hours!).\n  TCP_KEEPINTVL — seconds between probes (default 75).\n  TCP_KEEPCNT   — failed probes before declaring dead (default 9).\n\nFor responsive detection, set KEEPIDLE to 30-60 seconds."},
{s:"Sockets & Networking",q:"What is getaddrinfo()? Why should you use it instead of gethostbyname()?",a:"getaddrinfo(host, service, hints, &result) resolves a hostname to socket addresses.\n\nAdvantages over gethostbyname():\n1. Supports both IPv4 AND IPv6 (gethostbyname is IPv4 only).\n2. Thread-safe (gethostbyname uses static internal storage — not re-entrant).\n3. Resolves service names too ('http' → port 80).\n4. Returns a linked list of results (multiple IPs) for load balancing / fallback.\n\nUsage:\n  struct addrinfo hints = {0}, *res;\n  hints.ai_family = AF_UNSPEC;     // IPv4 or IPv6\n  hints.ai_socktype = SOCK_STREAM; // TCP\n  getaddrinfo(\"example.com\", \"443\", &hints, &res);\n  // iterate res, try connect() on each\n  freeaddrinfo(res);  // must free!"},
{s:"Sockets & Networking",q:"What happens during DNS resolution? What can go wrong?",a:"1. Application calls getaddrinfo() → C library checks /etc/hosts first.\n2. If not found, queries the configured DNS resolver (from /etc/resolv.conf).\n3. Resolver may have it cached; if not, it queries root → TLD → authoritative nameserver.\n4. Returns one or more IP addresses.\n\nWhat can go wrong:\n- DNS server unreachable → resolution hangs (subject to timeout, typically 5-30 sec).\n- NXDOMAIN → hostname doesn't exist.\n- Stale cache → resolves to an old/wrong IP.\n- DNS spoofing → attacker returns a malicious IP (mitigated by DNSSEC).\n- Slow DNS → adds latency to every new connection (mitigate with connection pooling or local caching)."},
{s:"Sockets & Networking",q:"What are the main architectural patterns for handling multiple clients in a C network server?",a:"1. Iterative (single-threaded, blocking):\n   while(1) { accept → handle → close }\n   Simple but one client at a time. Only for trivial/testing.\n\n2. Fork-per-connection:\n   accept → fork() → child handles, parent continues accepting.\n   Good isolation but heavy (process per client).\n\n3. Thread-per-connection:\n   accept → pthread_create → thread handles.\n   Lighter than fork but thread count can explode under load.\n\n4. Thread pool:\n   Fixed N worker threads. accept in main thread, dispatch to pool via queue.\n   Bounded resource usage. Good for moderate concurrency.\n\n5. Event-driven (select/poll/epoll):\n   Single thread, non-blocking I/O, handles thousands of connections.\n   Most scalable. Used by nginx, Redis, Node.js."},
{s:"Code: Sockets",q:"int server(int port) {\n    int lfd = socket(AF_INET,\n                     SOCK_STREAM, 0);\n    struct sockaddr_in addr = {0};\n    addr.sin_family = AF_INET;\n    addr.sin_port = htons(port);\n    addr.sin_addr.s_addr = INADDR_ANY;\n\n    if (bind(lfd, (void*)&addr,\n             sizeof(addr)) < 0)\n        return -1;\n\n    listen(lfd, 128);\n\n    while (1) {\n        int cfd = accept(lfd,\n                         NULL, NULL);\n        handle(cfd);\n    }\n}",a:"BUGS:\n\n1. fd leak on bind failure — if bind fails, lfd is never closed. Every failed retry leaks an fd.\n\n2. Missing SO_REUSEADDR — restarting the server fails with EADDRINUSE.\n\n3. client fd never closed — after handle(cfd) returns, cfd is leaked. Each client connection leaks one fd. Server hits EMFILE after ~1024 clients.\n\n4. No error check on socket(), accept(), or listen().\n\nFIX:\n  if (bind(...) < 0) { close(lfd); return -1; }\n  // after handle:\n  handle(cfd);\n  close(cfd);  // MUST close client fd"},
{s:"Code: Sockets",q:"/* Connect to a remote server */\nint fd = socket(AF_INET,\n                SOCK_STREAM, 0);\nstruct sockaddr_in srv = {0};\nsrv.sin_family = AF_INET;\nsrv.sin_port = htons(443);\ninet_pton(AF_INET,\n          \"10.0.0.1\", &srv.sin_addr);\n\nconnect(fd, (void*)&srv,\n        sizeof(srv));\n\nchar buf[1024];\nrecv(fd, buf, sizeof(buf), 0);\nprintf(\"%s\\n\", buf);",a:"BUGS:\n\n1. connect() with no timeout — if 10.0.0.1 is unreachable, this blocks for 60-120 seconds (TCP retransmit timeout). No way to cancel.\n\n2. connect() return not checked — connect returns -1 on failure. Code proceeds to recv on a failed socket.\n\n3. recv not checked — returns -1 on error, 0 on close.\n\n4. buf not null-terminated after recv.\n\n5. fd never closed.\n\nFIX:\n  Set non-blocking, use select() with timeout:\n  fcntl(fd, F_SETFL, O_NONBLOCK);\n  connect(fd, ...);\n  // select with 5-sec timeout\n  // check SO_ERROR\n  // restore blocking if needed"},
{s:"Code: Sockets",q:"struct hostent *h =\n    gethostbyname(hostname);\nstruct sockaddr_in addr;\naddr.sin_family = AF_INET;\nmemcpy(&addr.sin_addr,\n       h->h_addr, h->h_length);\naddr.sin_port = htons(port);\nconnect(fd, (void*)&addr,\n        sizeof(addr));",a:"BUGS:\n\n1. gethostbyname is DEPRECATED — IPv4 only, not thread-safe (returns pointer to static buffer). Two threads calling simultaneously corrupt each other's results.\n\n2. No error check — gethostbyname returns NULL on failure. h->h_addr dereferences NULL.\n\n3. No IPv6 support.\n\nFIX — Use getaddrinfo:\n  struct addrinfo hints = {0}, *res;\n  hints.ai_family = AF_UNSPEC;  // IPv4 or IPv6\n  hints.ai_socktype = SOCK_STREAM;\n  int rc = getaddrinfo(hostname,\n      port_str, &hints, &res);\n  if (rc != 0) {\n      fprintf(stderr, \"%s\\n\",\n              gai_strerror(rc));\n      return -1;\n  }\n  // try each result in the linked list\n  freeaddrinfo(res);"},
{s:"Values: Passionate",q:"Tell me about a project you were genuinely excited to work on. What made it special?",a:"GUIDELINES:\n- Pick a project where your enthusiasm had a visible impact on the outcome.\n- Show that passion led to going beyond the minimum — extra polish, volunteering for hard parts, staying late by choice.\n- Connect your excitement to the IMPACT, not just the tech.\n- Avoid: sounding like you only care about shiny tech.\n\nEXAMPLE STORY SEEDS:\n• Redesigning a legacy module you'd been frustrated with — took initiative, shipped something the team was proud of.\n• Building an internal tool that saved the team hours per week — you saw the pain point and couldn't let it go.\n• Mentoring a junior dev through their first production feature — the energy you got from watching them succeed."},
{s:"Values: Passionate",q:"How do you stay motivated when working on repetitive or unglamorous tasks?",a:"GUIDELINES:\n- Show maturity: passion isn't just about exciting work.\n- Frame boring work through its PURPOSE (reliability, user impact, team velocity).\n- Mention specific tactics: setting small goals, gamifying, finding optimization opportunities within routine work.\n- Show you don't need external motivation.\n\nEXAMPLE STORY SEEDS:\n• Writing hundreds of unit tests for a critical module — found satisfaction in the coverage number climbing and catching real bugs.\n• Maintaining a legacy system — found ways to incrementally improve it while keeping the lights on.\n• Doing code reviews daily — turned it into a learning habit, started a team style guide from patterns you noticed."},
{s:"Values: Passionate",q:"Describe a time you advocated strongly for a technical approach or idea. What happened?",a:"GUIDELINES:\n- Show conviction backed by DATA, not ego.\n- Structure: what you proposed, why you believed in it, how you made the case, the outcome.\n- Include how you handled pushback — did you listen, adapt, or stand firm? Why?\n- Win or lose, show what you learned.\n\nEXAMPLE STORY SEEDS:\n• Pushed for migrating from polling to event-driven architecture — built a prototype on your own time to prove the performance gain.\n• Advocated for adding CI/CD to a team that was deploying manually — showed the time savings with numbers.\n• Argued against a premature optimization that would have added complexity — the team agreed after you profiled the real bottleneck."},
{s:"Values: Passionate",q:"What area of software engineering are you most passionate about right now? How do you pursue it?",a:"GUIDELINES:\n- Be specific and genuine — not 'I love everything about coding.'\n- Show ACTIVE pursuit: side projects, reading, conferences, open source, study groups.\n- Connect it to the role you're interviewing for.\n- Show depth, not just breadth.\n\nEXAMPLE STORY SEEDS:\n• Deep interest in systems programming — you've been working through a C review, reading about memory allocators, and contributing to an open-source project.\n• Fascinated by networking and security — built a simple TLS client from scratch to understand the handshake.\n• Interested in performance — profiled a personal project and got a 10x improvement, now you can't stop looking at flamegraphs."},
{s:"Values: Authentic",q:"Tell me about a time you made a mistake at work. How did you handle it?",a:"GUIDELINES:\n- Pick a REAL mistake with real consequences — not a humble brag.\n- Structure: what happened, how you discovered it, what you did immediately, what you did to prevent recurrence.\n- Key: you owned it without being prompted. No blaming, no deflecting.\n- Show growth — what's different now because of that experience?\n\nEXAMPLE STORY SEEDS:\n• Deployed a config change that caused a production outage — you were the first to flag it, rolled back, wrote the post-mortem, added a pre-deploy check.\n• Merged code that broke a downstream service — owned it in standup, pair-debugged the fix, added integration tests.\n• Gave an inaccurate time estimate that put the team in a bind — communicated early when you realized, helped re-plan."},
{s:"Values: Authentic",q:"Describe a situation where you disagreed with your manager or team lead. How did you handle it?",a:"GUIDELINES:\n- Show you can disagree respectfully and constructively.\n- Structure: the disagreement, how you raised it, how you listened to their perspective, the resolution.\n- Key: disagree AND commit. Even if overruled, you executed with full effort.\n- Avoid: making the other person sound incompetent.\n\nEXAMPLE STORY SEEDS:\n• Disagreed on a deadline — you laid out the risks clearly, proposed a reduced scope alternative, the team found a middle ground.\n• Manager wanted to skip code review for speed — you explained the long-term cost with examples of past bugs, they agreed to lightweight reviews.\n• Disagreed on a tech stack choice — you presented your case, were overruled, committed fully, and it worked out fine (or you learned something)."},
{s:"Values: Authentic",q:"Have you ever had to deliver difficult or honest feedback to a peer? How did you approach it?",a:"GUIDELINES:\n- Show you prioritize honesty with kindness.\n- Structure: why the feedback was needed, how you delivered it (privately, with specifics, with empathy), the result.\n- Focus on the BEHAVIOR, not the person.\n- Show it came from a place of wanting them to succeed.\n\nEXAMPLE STORY SEEDS:\n• A teammate's code reviews were superficial and missing bugs — you had a private 1:1, shared specific examples, offered to pair-review together.\n• A peer was consistently missing standups — you asked if everything was OK first, then explained the impact on the team.\n• You noticed a teammate's design had a scalability issue — raised it early and privately before the review meeting so they weren't blindsided."},
{s:"Values: Authentic",q:"Tell me about a time you admitted you didn't know something. What did you do?",a:"GUIDELINES:\n- Show intellectual honesty — saying 'I don't know' is a strength, not a weakness.\n- The key is what you did AFTER admitting it: did you learn? Ask for help? Research?\n- Show you're comfortable being vulnerable in a professional setting.\n\nEXAMPLE STORY SEEDS:\n• Asked to design a caching layer with no experience — said so upfront, asked for a day to research, came back with a solid proposal.\n• In a code review, you challenged something but were wrong — publicly said 'you're right, I misunderstood' and thanked them.\n• Client asked a question in a meeting you couldn't answer — said 'I'll find out and follow up by EOD' instead of guessing."},
{s:"Values: Curious",q:"Tell me about a time you went deep into understanding something beyond what was required for your task.",a:"GUIDELINES:\n- Show self-directed learning — nobody asked you to dig deeper.\n- The depth should have led to a BETTER OUTCOME (caught a bug, improved performance, prevented a future issue).\n- Connect curiosity to impact, not just trivia.\n\nEXAMPLE STORY SEEDS:\n• Assigned to fix a memory leak — you didn't just fix it, you learned how the allocator works, and found two more leaks the team didn't know about.\n• Tasked with using a library — you read the source code and found an undocumented edge case that would have bitten you in production.\n• Debugging a slow query — went from 'add an index' to understanding the query planner, B-tree structure, and why the index wasn't being used."},
{s:"Values: Curious",q:"How do you stay current with technology and industry trends?",a:"GUIDELINES:\n- Be specific — name actual sources, communities, or habits.\n- Show consistency (daily/weekly habit), not just occasional bursts.\n- Mix passive learning (reading) with active learning (building, experimenting).\n- Mention how you've applied something you learned.\n\nEXAMPLE STORY SEEDS:\n• Follow specific newsletters/blogs (e.g. LWN.net for Linux, Hacker News, Julia Evans' zines) and read 2-3 articles daily.\n• Maintain a personal lab where you try new tools — recently set up a K8s cluster to understand networking.\n• Participate in a book club at work — currently reading a systems programming book and discussing one chapter per week."},
{s:"Values: Curious",q:"Describe a time when asking questions led you to a better solution.",a:"GUIDELINES:\n- Show that your questions weren't just for understanding — they CHANGED the outcome.\n- Good questions challenge assumptions, uncover hidden requirements, or reveal simpler approaches.\n- Show you ask 'why' not just 'how.'\n\nEXAMPLE STORY SEEDS:\n• In a design review, you asked 'what happens if this service is down?' — the team realized there was no fallback, and you designed a graceful degradation path.\n• Asked a PM 'who is actually using this feature?' — data showed almost nobody, and the team redirected effort to something higher-impact.\n• During debugging, you asked 'has this EVER worked?' instead of assuming regression — turned out it was a latent bug from day one, which changed the fix approach entirely."},
{s:"Values: Curious",q:"Tell me about a technology or concept you recently learned on your own. Why did you pursue it?",a:"GUIDELINES:\n- Show initiative — this was YOUR choice, not assigned.\n- Explain the 'why' — curiosity, relevance to your work, or a problem you wanted to solve.\n- Describe HOW you learned (hands-on, reading, course, building something).\n- Bonus: tie it to the role you're interviewing for.\n\nEXAMPLE STORY SEEDS:\n• Learned about TLS internals by implementing a basic handshake client — wanted to understand what OpenSSL was actually doing under the hood.\n• Studied Kubernetes by deploying a personal project — wanted to understand how container orchestration works before using it at work.\n• Dove into C memory layout and pointer semantics — built flashcards and coded exercises to prepare for systems-level work."},
{s:"Values: Accountable",q:"Tell me about a time you took ownership of a problem that wasn't strictly your responsibility.",a:"GUIDELINES:\n- Show you see gaps and fill them without being asked.\n- Structure: you noticed something was falling through the cracks, you stepped up, you drove it to resolution.\n- Avoid: sounding like you're complaining about teammates. Frame it as helping the team.\n\nEXAMPLE STORY SEEDS:\n• A production alert kept firing and nobody owned the service — you investigated, found the root cause, fixed it, and documented the runbook.\n• A cross-team dependency was blocking your project — instead of waiting, you reached out, helped them prioritize, and pair-debugged the issue.\n• An onboarding process was broken and new hires were struggling — you wrote a setup guide and mentored the next hire through it."},
{s:"Values: Accountable",q:"Describe a time you missed a deadline or fell short of a goal. What did you do?",a:"GUIDELINES:\n- Show EARLY communication — you didn't wait until the deadline to reveal the problem.\n- Structure: what happened, when you realized, how you communicated, what you proposed, the outcome.\n- Take responsibility without excessive self-blame.\n- Show what you changed to prevent recurrence.\n\nEXAMPLE STORY SEEDS:\n• Underestimated a migration task — flagged the risk a week early, proposed a phased rollout, delivered the critical path on time with the rest following.\n• A feature you built had more bugs than expected in QA — owned the quality gap, stayed to fix them, added test coverage, and improved your review process.\n• Sprint commitment was too aggressive — raised it in retro, helped the team adopt better estimation practices (e.g. story pointing, spike tickets for unknowns)."},
{s:"Values: Accountable",q:"How do you ensure the quality of your work before it reaches others (code review, QA, production)?",a:"GUIDELINES:\n- Show a systematic approach, not just 'I'm careful.'\n- Mention concrete practices: self-review, testing, checklists, local testing, documentation.\n- Show you own quality BEFORE the reviewer sees it.\n\nEXAMPLE STORY SEEDS:\n• Before every PR: you re-read the diff as if you're the reviewer, run the full test suite locally, and check edge cases you listed during implementation.\n• You maintain a personal pre-commit checklist: error handling, null checks, resource cleanup, logging.\n• You write tests FIRST for any bug fix (reproduce the bug in a test, then fix it) so regressions are impossible."},
{s:"Values: Accountable",q:"Tell me about a time you had to follow through on a commitment even when it became difficult.",a:"GUIDELINES:\n- Show grit and reliability — your word means something.\n- Structure: the original commitment, what made it harder than expected, what you did to honor it.\n- It's OK if the approach changed, as long as the outcome was delivered and communicated.\n\nEXAMPLE STORY SEEDS:\n• Committed to a feature demo date, then discovered a critical dependency was broken — worked evenings to build a workaround and delivered on time.\n• Promised to mentor a junior dev weekly — kept the meetings even during crunch time because consistency mattered for their growth.\n• Volunteered to own the on-call rotation during a tough month — didn't bail when it got hard, handled 3 AM pages, documented every incident."},
{s:"Competency: Software Dev",q:"Walk me through how you approach debugging a complex issue in production.",a:"GUIDELINES:\n- Show a SYSTEMATIC method, not just 'I looked at the code.'\n- Structure: reproduce → isolate → hypothesize → verify → fix → prevent.\n- Mention specific tools: logs, metrics, debuggers, strace, Valgrind, sanitizers.\n- Show you think about impact (who's affected?) and communication (who needs to know?).\n\nEXAMPLE STORY SEEDS:\n• Memory leak in a long-running C service — used Valgrind to find the leak, traced it to a missing free in an error path, added cleanup and a regression test.\n• Intermittent crash — enabled ASan in a staging build, reproduced under load, found a race condition in shared state.\n• Production latency spike — checked metrics dashboards, correlated with a recent deploy, bisected the change, found an O(n²) loop."},
{s:"Competency: Software Dev",q:"Describe your approach to code review. What do you look for?",a:"GUIDELINES:\n- Show you review for CORRECTNESS, MAINTAINABILITY, and SECURITY — not just style.\n- Mention: edge cases, error handling, resource cleanup, thread safety, naming, test coverage.\n- Show you give actionable feedback (not just 'this is wrong' but 'consider X because Y').\n- Show you also acknowledge good work in reviews.\n\nEXAMPLE STORY SEEDS:\n• Caught a use-after-free in a teammate's PR by tracing the pointer's lifecycle through three functions.\n• Noticed a SQL query was vulnerable to injection — suggested parameterized queries and linked a relevant CVE.\n• Praised a teammate's clean abstraction in a review, then suggested one edge case they'd missed — they appreciated both."},
