{s:"Code: Functions",q:"int sum_digits(int n) {\n    int sum = 0;\n    while (n > 0) {\n        sum += n % 10;\n        n /= 10;\n    }\n    return sum;\n}",a:"BUG — Fails for negative numbers:\nIf n is negative, n > 0 is immediately false — returns 0 instead of digit sum.\n\nn % 10 for negative n gives a negative remainder in C99.\n\nEdge case: n = INT_MIN cannot be negated safely (overflow).\n\nFIX:\n  unsigned int un = (n < 0)\n      ? -(unsigned int)n\n      : (unsigned int)n;\n  while (un > 0) {\n      sum += un % 10;\n      un /= 10;\n  }"},
{s:"Code: Functions",q:"#define BUFFER_SIZE 1024\n\nvoid process_input(void) {\n    char buf[BUFFER_SIZE];\n    gets(buf);\n    printf(\"Got: %s\\n\", buf);\n}",a:"BUG — gets() is unsafe and REMOVED from C11:\ngets() reads unbounded input. Any input longer than 1024 bytes overflows buf. There is NO safe way to use gets().\n\nFIX:\n  if (!fgets(buf, sizeof(buf), stdin))\n      return;\n  // fgets includes '\\n'; strip it:\n  buf[strcspn(buf, \"\\n\")] = '\\0';"},
{s:"Code: Functions",q:"int power(int base, int exp) {\n    if (exp == 0) return 1;\n    return base *\n           power(base, exp - 1);\n}",a:"BUGS:\n\n1. No handling of negative exponent — power(2, -1) recurses forever → stack overflow.\n\n2. Integer overflow for large base/exp.\n\n3. Inefficient: O(exp) multiplications. Use fast exponentiation O(log n).\n\nFIX:\n  long long power(long long base, int exp) {\n      if (exp < 0) return 0;\n      if (exp == 0) return 1;\n      if (exp % 2 == 0) {\n          long long half = power(base, exp/2);\n          return half * half;\n      }\n      return base * power(base, exp-1);\n  }"},
{s:"Code: Functions",q:"int count_set_bits(unsigned int n) {\n    int count = 0;\n    while (n) {\n        count += n & 1;\n        n >> 1;\n    }\n    return count;\n}",a:"BUG — n >> 1 does not modify n:\nn >> 1 computes the shifted value but DISCARDS it. n is unchanged. The loop runs forever (if n != 0).\n\nFIX:\n  n >>= 1;   // or: n = n >> 1;\n\nIMPROVEMENT — Kernighan's trick:\n  while (n) { n &= (n - 1); count++; }\n  // O(number of set bits) instead of O(32)"},
{s:"Code: Functions",q:"void fill_lookup(void) {\n    int table[256];\n    for (int i = 0; i < 256; i++) {\n        table[i] = i * i;\n    }\n}",a:"BUG — table is computed but never used:\ntable is local. All work is thrown away on return. The compiler will optimize the entire function to nothing at -O2 (dead store elimination).\n\nFIX — Return or use the table:\n  void fill_lookup(int table[256]) {\n      for (int i = 0; i < 256; i++)\n          table[i] = i * i;\n  }\n  // Or: make it static and return a pointer."},
{s:"Code: Functions",q:"int safe_divide(int a, int b,\n                int *result) {\n    if (b == 0) return -1;\n    result = a / b;\n    return 0;\n}",a:"BUG — Assigns to the pointer, not through it:\nresult = a / b sets the local pointer variable to an int value. This is a type mismatch and the caller's storage is never written.\n\nFIX:\n  *result = a / b;  // dereference!"},
{s:"Code: Concurrency",q:"int done = 0;\n\nvoid *producer(void *arg) {\n    sleep(1);\n    done = 1;\n    return NULL;\n}\n\nvoid *consumer(void *arg) {\n    while (!done) { /* spin */ }\n    printf(\"Done!\\n\");\n    return NULL;\n}",a:"BUGS:\n\n1. Data race on done — written by producer, read by consumer, no synchronization. UB in C11.\n\n2. Compiler may cache done in a register and never reload it — consumer spins forever even after done = 1.\n\n3. No memory ordering guarantee.\n\nFIX:\n  _Atomic int done = 0;  // C11 atomic\n\nOr use pthread_mutex + pthread_cond_signal to avoid busy-waiting entirely."},
{s:"Code: Concurrency",q:"pthread_mutex_t lock_a, lock_b;\n/* both initialized */\n\nvoid *thread_one(void *arg) {\n    pthread_mutex_lock(&lock_a);\n    sleep(1);\n    pthread_mutex_lock(&lock_b);\n    pthread_mutex_unlock(&lock_b);\n    pthread_mutex_unlock(&lock_a);\n}\n\nvoid *thread_two(void *arg) {\n    pthread_mutex_lock(&lock_b);\n    sleep(1);\n    pthread_mutex_lock(&lock_a);\n    pthread_mutex_unlock(&lock_a);\n    pthread_mutex_unlock(&lock_b);\n}",a:"BUG — Classic ABBA deadlock:\nIf thread_one acquires lock_a and thread_two acquires lock_b simultaneously, each waits for the other's lock forever.\n\nAll four Coffman conditions hold: mutual exclusion, hold and wait, no preemption, circular wait.\n\nFIX — Enforce consistent lock ordering:\nBoth threads must always acquire lock_a BEFORE lock_b:\n  thread_two:\n    pthread_mutex_lock(&lock_a);  // same order\n    pthread_mutex_lock(&lock_b);"},
{s:"Code: Concurrency",q:"static int initialized = 0;\nstatic MyObject *instance = NULL;\n\nMyObject *get_instance(void) {\n    if (!initialized) {\n        instance = create_object();\n        initialized = 1;\n    }\n    return instance;\n}",a:"BUG — Not thread-safe (singleton race):\nTwo threads can both read initialized == 0, both call create_object() — double initialization, memory leak, and potentially returning a partially-initialized object.\n\nEven a naive double-check with a mutex has memory ordering issues.\n\nFIX — Use pthread_once:\n  static pthread_once_t once =\n      PTHREAD_ONCE_INIT;\n  static void do_init(void) {\n      instance = create_object();\n  }\n  MyObject *get_instance(void) {\n      pthread_once(&once, do_init);\n      return instance;\n  }"},
{s:"Code: Macros",q:"#define SQUARE(x)  x * x\n\nint main(void) {\n    int a = 3;\n    printf(\"%d\\n\",\n           SQUARE(a + 1));  // expect 16\n    printf(\"%d\\n\",\n           100 / SQUARE(5)); // expect 4\n    return 0;\n}",a:"BUG — No parentheses:\nSQUARE(a + 1) → a + 1 * a + 1 → 7 (not 16)\n100 / SQUARE(5) → 100 / 5 * 5 → 100 (not 4)\n\nFIX:\n  #define SQUARE(x) ((x) * (x))\n\nRESIDUAL ISSUE:\nSQUARE(x++) → ((x++) * (x++)) — x incremented twice. For this, prefer an inline function:\n  static inline int square(int x) {\n      return x * x;\n  }"},
{s:"Code: Macros",q:"#define MAX(a, b) \\\n    ((a) > (b) ? (a) : (b))\n\nint main(void) {\n    int x = 5;\n    int y = MAX(x++, 3);\n    printf(\"x=%d y=%d\\n\", x, y);\n    return 0;\n}",a:"BUG — Double evaluation side effect:\nExpands to: ((x++) > (3) ? (x++) : (3))\nSince x=5 > 3, both x++ arms execute — x incremented TWICE.\n\nResult: y = 5 (first x++), x = 7.\nExpected: y = 5, x = 6.\n\nFIX — Use inline function:\n  static inline int max_int(int a, int b) {\n      return a > b ? a : b;\n  }\n  // Arguments evaluated exactly once."},
{s:"Code: Macros",q:"#define ARRAY_SIZE(arr) \\\n    (sizeof(arr) / sizeof(arr[0]))\n\nvoid process(int *arr) {\n    for (int i = 0;\n         i < ARRAY_SIZE(arr); i++) {\n        printf(\"%d\\n\", arr[i]);\n    }\n}",a:"BUG — ARRAY_SIZE on a pointer, not an array:\nWhen arr decays to int* (function parameter), sizeof(arr) = 8 (pointer size on 64-bit). sizeof(arr[0]) = 4. Result: 8/4 = 2.\n\nThe loop iterates only 2 times.\n\nARRAY_SIZE only works on actual array objects in the same scope.\n\nFIX:\n  void process(int *arr, size_t len) {\n      for (size_t i = 0; i < len; i++) ...\n  }"},
{s:"Code: Macros",q:"#define MIN(a,b)  a < b ? a : b\n\nint val = MIN(3, 5) + 1;",a:"BUG — No parentheses:\nExpands to: 3 < 5 ? 3 : 5 + 1\n\nDue to precedence (?: is low): 3 < 5 ? 3 : (5+1) → 3.\nExpected: MIN(3,5) + 1 = 3 + 1 = 4.\n\nFIX:\n  #define MIN(a,b) ((a) < (b) ? (a) : (b))"},
{s:"Code: Security",q:"void handle_input(void) {\n    char name[64];\n    printf(\"Enter name: \");\n    scanf(\"%s\", name);\n    printf(\"Hello, %s\\n\", name);\n}",a:"BUG — scanf %s has no width limit:\n%s reads until whitespace with no length limit — overflows name[64] on long input. Classic stack buffer overflow.\n\nFIX:\n  scanf(\"%63s\", name);  // at most 63 + '\\0'\n  // Or use:\n  fgets(name, sizeof(name), stdin);"},
{s:"Code: Security",q:"int read_packet(int sock,\n                char *buf,\n                int len) {\n    int received =\n        recv(sock, buf, len, 0);\n    buf[received] = '\\0';\n    return received;\n}",a:"BUGS:\n\n1. recv returns -1 on error and 0 on connection close. buf[-1] = '\\0' is an out-of-bounds write.\n\n2. If received == len, buf[len] is one past the end.\n\nFIX:\n  ssize_t received =\n      recv(sock, buf, len - 1, 0);\n  if (received <= 0) return received;\n  buf[received] = '\\0';"},
{s:"Code: Security",q:"int **make_grid(int rows, int cols) {\n    int **grid = malloc(\n        rows * sizeof(int*));\n    for (int i = 0; i < rows; i++) {\n        grid[i] = malloc(\n            cols * sizeof(int));\n    }\n    return grid;\n}\n\nvoid free_grid(int **grid,\n               int rows) {\n    free(grid);\n}",a:"BUG — Memory leak in free_grid:\nEach grid[i] was individually malloc'd but free_grid only frees the outer array. All inner row arrays are leaked.\n\nFIX:\n  void free_grid(int **grid, int rows) {\n      for (int i = 0; i < rows; i++)\n          free(grid[i]);\n      free(grid);\n  }"},
{s:"Code: Security",q:"void copy_input(char *dst,\n                const char *src,\n                size_t dst_size) {\n    if (strlen(src) <= dst_size) {\n        memcpy(dst, src,\n               strlen(src));\n    }\n}",a:"BUGS:\n\n1. Off-by-one: strlen(src) <= dst_size allows copying exactly dst_size bytes — no room for '\\0'.\n\n2. No null terminator written — dst is not a valid C string.\n\n3. strlen called twice (minor inefficiency).\n\nFIX:\n  if (dst_size == 0) return;\n  size_t len = strlen(src);\n  size_t n = (len < dst_size - 1)\n             ? len : dst_size - 1;\n  memcpy(dst, src, n);\n  dst[n] = '\\0';"},
{s:"Code: Security",q:"int compute_total(int *prices,\n                  int n) {\n    int total = 0;\n    for (int i = 0; i < n; i++) {\n        total += prices[i];\n    }\n    return total;\n}\n/* prices array has 100 elements,\n   n is received from network */",a:"BUG — No input validation on n:\nn comes from an untrusted source.\n\n1. Negative n: loop doesn't run, returns 0.\n2. n > 100: reads past the array — out-of-bounds read, information disclosure or crash.\n3. Integer overflow: large prices/n can overflow total.\n\nFIX:\n  #define MAX_PRICES 100\n  if (n < 0 || n > MAX_PRICES) return -1;\n  long long total = 0;\n  for (int i = 0; i < n; i++)\n      total += prices[i];\n  if (total > INT_MAX) return -1;\n  return (int)total;"},
{s:"Code: Tricky Patterns",q:"int arr[5] = {0};\nint *p = arr;\n\nfor (int i = 0; i < 5; i++) {\n    *(p++) = i * 10;\n}\n\n/* Questions:\n   What is *p after the loop?\n   What is arr[2]? */",a:"*p after the loop:\np has been incremented 5 times past arr[0], so p == &arr[5] (one past the end). *p is an out-of-bounds read — UNDEFINED BEHAVIOR.\n\narr[2]:\narr[2] = 20 (i=2: *(p++) = 2*10 = 20 → stored at arr[2] before p advances).\n\nPointing one-past-end is valid; dereferencing is not."},
{s:"Code: Tricky Patterns",q:"void mystery(char *s) {\n    while (*s) {\n        if (*s >= 'a' && *s <= 'z')\n            *s -= 32;\n        s++;\n    }\n}",a:"WHAT IT DOES:\nConverts a string to uppercase in-place (ASCII only). Subtracting 32 from a lowercase letter gives the uppercase value.\n\nISSUES:\n1. Only works for ASCII; not locale-aware. Use toupper((unsigned char)c) instead.\n2. Modifies string in place — will CRASH on a string literal (read-only).\n3. The magic number 32 is not self-documenting. Use 'a'-'A' or toupper()."},
{s:"Code: Tricky Patterns",q:"struct S { char a; int b;\n           char c; double d; };\nstruct T { int b; double d;\n           char a; char c; };\n\n/* What are sizeof(S) and\n   sizeof(T) on a 64-bit system? */",a:"sizeof(S): 24 bytes\n  char a (1) + 3pad + int b (4) + char c (1) + 7pad + double d (8) = 24\n\nsizeof(T): 24 bytes\n  int b (4) + 4pad + double d (8) + char a (1) + char c (1) + 6pad = 24\n\nOptimal reorder:\n  struct U { double d; int b; char a; char c; };\n  // 8 + 4 + 1 + 1 + 2pad = 16 bytes\n\nKEY LESSON: Order members largest-to-smallest to minimize padding."},
{s:"Code: Tricky Patterns",q:"void init(int *arr, size_t n) {\n    memset(arr, 1,\n           n * sizeof(int));\n}\n\n/* After init, what is arr[0]? */",a:"arr[0] is NOT 1.\n\nmemset sets each BYTE to 0x01. An int is 4 bytes, so arr[0] has bytes {0x01, 0x01, 0x01, 0x01} = 0x01010101 = 16843009.\n\nmemset(arr, 0, ...) and memset(arr, 0xFF, ...) give meaningful int values (0 and -1). Any other byte value is almost never what you want.\n\nFIX — Use a loop:\n  for (size_t i = 0; i < n; i++) arr[i] = 1;"},
{s:"Code: Tricky Patterns",q:"unsigned char a = 200;\nunsigned char b = 100;\nunsigned char c = a + b;\nint           d = a + b;\n\n/* What are c and d? */",a:"a + b:\nBoth promoted to int (integer promotion). int(200) + int(100) = 300.\n\nunsigned char c = 300:\n300 truncated to 8 bits: 300 - 256 = 44. c = 44.\n\nint d = 300:\nNo truncation. d = 300.\n\nKEY LESSON: Integer promotion saves the int; unsigned char truncates on assignment when value exceeds UCHAR_MAX (255)."},
{s:"Code: Tricky Patterns",q:"int arr[] = {10, 20, 30, 40, 50};\nprintf(\"%d\\n\", 2[arr]);",a:"ANSWER: Prints 30.\n\nIn C, a[i] is defined as *(a + i), which is commutative: *(2 + arr) == *(arr + 2) == arr[2] = 30.\n\nCompletely legal but intentionally confusing. You would never write this in production code."},
{s:"Code: Tricky Patterns",q:"int n = 0;\nif (n = 5)\n    printf(\"True\\n\");\nelse\n    printf(\"False\\n\");",a:"WHAT: This is ASSIGNMENT, not comparison.\n\nn = 5 assigns 5 to n and evaluates to 5 (non-zero → true). Output: \"True\".\n\nBUG (most likely): Programmer meant n == 5.\n\nGCC warns with -Wparentheses. Writing if ((n = 5)) silences the warning and signals intentional assignment."},
{s:"Code: Tricky Patterns",q:"size_t len = 0;\nif (len - 1 < 10) {\n    printf(\"small\\n\");\n}",a:"BUG — Unsigned underflow:\nlen is size_t (unsigned). len - 1 = 0 - 1 wraps to SIZE_MAX (18446744073709551615 on 64-bit).\n\nSIZE_MAX < 10 is FALSE. \"small\" is never printed.\n\nThis is a very common bug with size_t in loop termination.\n\nFIX:\n  if (len > 0 && len - 1 < 10) { ... }\n  // OR: if (len < 11) { ... }"},
{s:"Code: Tricky Patterns",q:"void *memdup(const void *src,\n             size_t n) {\n    void *dst = malloc(n);\n    if (dst) memcpy(dst, src, n);\n    return dst;\n}\n\n/* Is this correct? */",a:"ASSESSMENT — Correct and well-written:\n\n- Checks malloc return before use.\n- Returns NULL on allocation failure.\n- Works for any type (void*).\n- No UB.\n\nMINOR IMPROVEMENTS:\n1. If n == 0, malloc may return NULL or a unique pointer; memcpy with n==0 is safe. Consider: if (n == 0) return NULL;\n2. Document that caller must free().\n3. Could add: if (!src) return NULL;"}
];

const LS_KEY = 'cflash_missed_v1';
function saveMissed(cards) { try { localStorage.setItem(LS_KEY, JSON.stringify(cards.map(c=>c.q))); } catch(e) {} }
function loadMissed() { try { const raw=localStorage.getItem(LS_KEY); if(!raw)return[]; return JSON.parse(raw).map(q=>ALL_CARDS.find(c=>c.q===q)).filter(Boolean); } catch(e){ return[]; } }
function clearSaved() { try { localStorage.removeItem(LS_KEY); } catch(e) {} }

let deck=[],idx=0,flipped=false,got=0,missed=0,section='all',missedCards=[];

function isCodeCard(c) { return c.s.startsWith('Code:'); }

function updateSavedPill() {
  const saved = loadMissed();
  const pill = document.getElementById('savedPill');
  const bar = document.getElementById('savedBar');
  if (saved.length > 0) {
    pill.innerHTML = '&#9733; ' + saved.length + ' saved &mdash; tap to review';
    pill.style.display = 'inline-block';
    bar.classList.add('visible');
  } else {
    pill.style.display = 'none';
    bar.classList.remove('visible');
  }
}

function filterSection() {
  section = document.getElementById('sectionSel').value;
  if (section === 'all') {
    deck = [...ALL_CARDS];
  } else if (section === '__concepts__') {
    deck = ALL_CARDS.filter(c => !isCodeCard(c));
  } else if (section === '__code__') {
    deck = ALL_CARDS.filter(c => isCodeCard(c));
  } else {
    deck = ALL_CARDS.filter(c => c.s === section);
  }
  resetDeck(false);
}

function shuffle() {
  for(let i=deck.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx=0;got=0;missed=0;missedCards=[];flipped=false;render();
}

function resetDeck(doFilter=true) {
  if(doFilter) filterSection();
  idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none';
  document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden');
  document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped');
  render();
}

function reviewMissed() {
  if(!missedCards.length)return;
  deck=[...missedCards];
  idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none';
  document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden');
  document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped');
  render();
}

function reviewSaved() {
  const saved = loadMissed();
  if(!saved.length) return;
  deck=[...saved]; section='all';
  document.getElementById('sectionSel').value='all';
  idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none';
  document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden');
  document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped');
  render();
}

function clearSavedCards() {
  const n = loadMissed().length;
  if(!n) return;
  if(!confirm('Clear all ' + n + ' saved cards?')) return;
  clearSaved();
  updateSavedPill();
}

function flipCard() {
  if(idx>=deck.length)return;
  flipped=!flipped;
  document.getElementById('cardInner').classList.toggle('flipped',flipped);
  const vr=document.getElementById('verdictRow');
  if(flipped) vr.classList.remove('verdict-hidden');
  else vr.classList.add('verdict-hidden');
}

function verdict(wasGot) {
  if(!flipped)return;
  if(wasGot) {
    got++;
    const saved = loadMissed().filter(c => c.q !== deck[idx].q);
    saveMissed(saved);
  } else {
    missed++;
    missedCards.push(deck[idx]);
    const existing = loadMissed();
    if(!existing.some(c => c.q === deck[idx].q)) saveMissed([...existing, deck[idx]]);
  }
  idx++;flipped=false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('verdictRow').classList.add('verdict-hidden');
  updateSavedPill();
  if(idx>=deck.length) showDone();
  else render();
}

function prevCard() {
  if(idx>0){idx--;flipped=false;document.getElementById('cardInner').classList.remove('flipped');document.getElementById('verdictRow').classList.add('verdict-hidden');render();}
}
function nextCard() {
  if(idx<deck.length-1){idx++;flipped=false;document.getElementById('cardInner').classList.remove('flipped');document.getElementById('verdictRow').classList.add('verdict-hidden');render();}
}

function render() {
  if(!deck.length)return;
  const c=deck[Math.min(idx,deck.length-1)];
  const code = isCodeCard(c);
  // Front label
  const frontLabel = document.getElementById('frontLabel');
  frontLabel.innerHTML = (code ? 'Code Review' : 'Question') + ' &nbsp;&#x21C4; tap to flip';
  // Front card styling
  const cardFront = document.getElementById('cardFront');
  cardFront.classList.toggle('code-card', code);
  // Question text
  const frontQ = document.getElementById('frontQ');
  frontQ.textContent = c.q;
  frontQ.classList.toggle('code-text', code);
  // Answer
  document.getElementById('backA').innerHTML = formatAnswer(c.a);
  // Section pill
  const pill = document.getElementById('sectionPill');
  pill.textContent = c.s;
  pill.className = 'section-pill ' + (code ? 'code' : 'concept');
  // Counter
  document.getElementById('cardCounter').textContent = 'Card '+(idx+1)+' of '+deck.length;
  const done=got+missed;
  document.getElementById('sTotal').textContent=deck.length;
  document.getElementById('sGot').textContent=got;
  document.getElementById('sMiss').textContent=missed;
  document.getElementById('sLeft').textContent=deck.length-done;
  document.getElementById('progressFill').style.width=(deck.length?Math.round(done/deck.length*100):0)+'%';
}

function formatAnswer(a) {
  const esc=a.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const parts=esc.split('\n');
  let out='',inCode=false,codeBuf='';
  for(const line of parts){
    const isCode=/^  /.test(line)&&line.trim().length>0;
    if(isCode){inCode=true;codeBuf+=(codeBuf?'\n':'')+line.trim();}
    else{
      if(inCode){out+='<pre>'+codeBuf+'</pre>';codeBuf='';inCode=false;}
      out+=(out&&!out.endsWith('</pre>'))?'<br>'+line:line;
    }
  }
  if(inCode)out+='<pre>'+codeBuf+'</pre>';
  return out;
}

function showDone() {
  document.getElementById('cardScene').classList.add('hidden');
  document.getElementById('footer').classList.add('hidden');
  document.getElementById('doneBanner').style.display='block';
  const pct=deck.length?Math.round(got/deck.length*100):0;
  document.getElementById('doneStats').textContent='You got '+got+' of '+deck.length+' correct ('+pct+'%). '+missed+' cards saved for review.';
  document.getElementById('reviewMissedBtn').style.display=missedCards.length>0?'inline-block':'none';
  const savedCount=loadMissed().length;
  const savedBtn=document.getElementById('reviewSavedDoneBtn');
  savedBtn.textContent='Review all saved ('+savedCount+')';
  savedBtn.style.display=savedCount>0?'inline-block':'none';
}

updateSavedPill();
filterSection();
</script>
</body>
</html>
