{s:"Competency: Software Dev",q:"Tell me about a time you had to make a technical trade-off. How did you decide?",a:"GUIDELINES:\n- Show structured thinking: what were the options, what were the trade-offs, who was affected, what did you choose and why.\n- Good trade-offs consider: time, complexity, performance, maintainability, team skill, reversibility.\n- Show you communicated the trade-off to stakeholders.\n\nEXAMPLE STORY SEEDS:\n• Chose a simple brute-force approach over an elegant but complex algorithm — the dataset was small, shipping fast mattered, and you documented the scaling limit.\n• Decided to use a third-party library vs building in-house — weighed maintenance burden, license, and time-to-market.\n• Chose eventual consistency over strong consistency in a distributed feature — latency requirements demanded it, documented the edge cases."},
{s:"Competency: Software Dev",q:"How do you approach writing tests? What kinds of tests do you write?",a:"GUIDELINES:\n- Show you understand the testing pyramid: unit → integration → end-to-end.\n- Mention WHEN you write tests (TDD, with the PR, after bug fixes).\n- Show you test the RIGHT things: edge cases, error paths, not just happy paths.\n- Mention coverage as a guide, not a target.\n\nEXAMPLE STORY SEEDS:\n• For every bug fix, you write a failing test FIRST that reproduces the bug, then fix the code — ensures the bug can never return.\n• Wrote integration tests for a socket server — tested connection, partial send, timeout, and unexpected disconnect.\n• Caught a boundary condition by testing with empty input, NULL, max-length, and negative values — standard test matrix you apply to every function."},
{s:"Competency: Software Dev",q:"Describe a time you improved a process, tool, or workflow on your team.",a:"GUIDELINES:\n- Show initiative — you identified the problem, proposed the solution, and drove adoption.\n- Quantify impact if possible (time saved, bugs prevented, faster deploys).\n- Show you considered the team's buy-in (didn't just force a change).\n\nEXAMPLE STORY SEEDS:\n• Introduced static analysis (clang-tidy) to the CI pipeline — caught 12 potential bugs in the first week, team adopted it permanently.\n• Created a Makefile template that standardized build flags (-Wall -Wextra -Werror) across all team projects.\n• Set up a shared Valgrind regression test that ran nightly — caught memory leaks before they reached production."},
{s:"Competency: Software Dev",q:"Tell me about a time you worked with a difficult codebase or legacy system. How did you navigate it?",a:"GUIDELINES:\n- Show patience, systematic exploration, and respect for existing decisions.\n- Mention techniques: reading tests first, tracing execution, adding logging, drawing diagrams, asking the original authors.\n- Show you improved it incrementally (not 'I rewrote everything').\n\nEXAMPLE STORY SEEDS:\n• Inherited a 10-year-old C networking module with no docs — spent a week reading, added comments and a README, then safely refactored the error handling.\n• Needed to add a feature to unfamiliar code — wrote characterization tests first to understand the current behavior before changing anything.\n• Found a legacy module with no tests and global state everywhere — incrementally extracted pure functions, added tests around them, reduced coupling over several sprints."},
{s:"Competency: Software Dev",q:"How do you handle competing priorities or multiple urgent tasks?",a:"GUIDELINES:\n- Show you prioritize by IMPACT and URGENCY, not just who's loudest.\n- Mention communication: you tell stakeholders what you're prioritizing and why.\n- Show you can say 'not right now' with a plan for when.\n\nEXAMPLE STORY SEEDS:\n• Two production issues hit simultaneously — triaged by impact (one affected 1000 users, the other affected 5), communicated the plan, fixed the high-impact one first.\n• Manager added an urgent request mid-sprint — you showed the current sprint load, proposed what could be deferred, and agreed on a realistic plan.\n• Balanced feature work with tech debt — allocated 20% of each sprint to debt reduction and tracked the payoff over time."},
{s:"Competency: Software Dev",q:"Describe a time you collaborated with a non-technical stakeholder to define requirements.",a:"GUIDELINES:\n- Show you can translate between business needs and technical solutions.\n- Ask CLARIFYING questions — don't just build what's literally asked for.\n- Show empathy for their perspective and constraints.\n\nEXAMPLE STORY SEEDS:\n• A PM asked for 'real-time updates' — you asked 'how real-time?' and learned 30-second polling was fine, saving weeks vs building WebSockets.\n• A client wanted 'everything encrypted' — you walked them through what TLS covers vs what needs application-layer encryption, scoped the work appropriately.\n• A support team asked for a 'search feature' — you asked about the actual workflow, discovered they needed filtering by 3 fields, not full-text search."},
{s:"Competency: Software Dev",q:"Tell me about a time you mentored someone or helped a teammate grow.",a:"GUIDELINES:\n- Show you invest in others, not just your own output.\n- Mention specific approaches: pair programming, code review feedback, sharing resources, regular 1:1s.\n- Show the RESULT — what did they accomplish because of your help?\n\nEXAMPLE STORY SEEDS:\n• Pair-programmed with a junior dev on their first C module — walked through pointer arithmetic, memory management, and review feedback patterns. They shipped independently within a month.\n• Noticed a teammate struggling with debugging — taught them to use GDB and Valgrind, now they're the team's go-to for memory issues.\n• Wrote a 'Common C Pitfalls' doc after seeing the same review comments repeatedly — reduced first-PR revision cycles across the team."},
{s:"Competency: Software Dev",q:"How do you approach estimating the effort for a task or project?",a:"GUIDELINES:\n- Show a method beyond guessing: break down into subtasks, identify unknowns, add buffer.\n- Mention spike/research tasks for unknowns.\n- Show you communicate uncertainty ranges, not false precision.\n- Show you re-estimate when you learn new information.\n\nEXAMPLE STORY SEEDS:\n• For a networking feature: broke it into socket setup, protocol handling, error paths, tests, docs — estimated each, added 30% buffer for unknowns, hit the estimate within a day.\n• For an unfamiliar area: proposed a 2-day spike first to derisk, then gave a confident estimate after the spike.\n• Learned to multiply your initial gut estimate by 2-3x after repeatedly underestimating integration and edge case work."}
];

const LS_KEY='cflash_missed_v1';
function saveMissed(cards){ try{ localStorage.setItem(LS_KEY,JSON.stringify(cards.map(c=>c.q))); }catch(e){} }
function loadMissed(){ try{ const r=localStorage.getItem(LS_KEY); if(!r)return[]; return JSON.parse(r).map(q=>ALL_CARDS.find(c=>c.q===q)).filter(Boolean); }catch(e){ return[]; } }
function clearSaved(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }

let deck=[],idx=0,flipped=false,got=0,missed=0,section='all',missedCards=[];
function isCodeCard(c){ return c.s.startsWith('Code:'); }
function isBehavCard(c){ return c.s.startsWith('Values:') || c.s.startsWith('Competency:'); }
function cardType(c){ if(isCodeCard(c))return'code'; if(isBehavCard(c))return'behavioral'; return'concept'; }

function updateSavedPill(){
  const saved=loadMissed(); const pill=document.getElementById('savedPill'); const bar=document.getElementById('savedBar');
  if(saved.length>0){ pill.innerHTML='&#9733; '+saved.length+' saved &mdash; tap to review'; pill.style.display='inline-block'; bar.classList.add('visible'); }
  else{ pill.style.display='none'; bar.classList.remove('visible'); }
}

function filterSection(){
  section=document.getElementById('sectionSel').value;
  if(section==='all') deck=[...ALL_CARDS];
  else if(section==='__concepts__') deck=ALL_CARDS.filter(c=>!isCodeCard(c)&&!isBehavCard(c));
  else if(section==='__code__') deck=ALL_CARDS.filter(c=>isCodeCard(c));
  else if(section==='__behavioral__') deck=ALL_CARDS.filter(c=>isBehavCard(c));
  else deck=ALL_CARDS.filter(c=>c.s===section);
  resetDeck(false);
}

function shuffle(){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]; } idx=0;got=0;missed=0;missedCards=[];flipped=false;render(); }

function resetDeck(doFilter=true){ if(doFilter)filterSection(); idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none'; document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden'); document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped'); render(); }

function reviewMissed(){ if(!missedCards.length)return; deck=[...missedCards]; idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none'; document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden'); document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped'); render(); }

function reviewSaved(){ const saved=loadMissed(); if(!saved.length)return; deck=[...saved]; section='all';
  document.getElementById('sectionSel').value='all'; idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none'; document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden'); document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped'); render(); }

function clearSavedCards(){ const n=loadMissed().length; if(!n)return; if(!confirm('Clear all '+n+' saved cards?'))return; clearSaved(); updateSavedPill(); }

function flipCard(){ if(idx>=deck.length)return; flipped=!flipped; document.getElementById('cardInner').classList.toggle('flipped',flipped);
  const vr=document.getElementById('verdictRow'); if(flipped)vr.classList.remove('verdict-hidden'); else vr.classList.add('verdict-hidden'); }

function verdict(wasGot){ if(!flipped)return;
  if(wasGot){ got++; const saved=loadMissed().filter(c=>c.q!==deck[idx].q); saveMissed(saved); }
  else{ missed++; missedCards.push(deck[idx]); const ex=loadMissed(); if(!ex.some(c=>c.q===deck[idx].q))saveMissed([...ex,deck[idx]]); }
  idx++;flipped=false; document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('verdictRow').classList.add('verdict-hidden'); updateSavedPill();
  if(idx>=deck.length)showDone(); else render(); }

function prevCard(){ if(idx>0){idx--;flipped=false;document.getElementById('cardInner').classList.remove('flipped');document.getElementById('verdictRow').classList.add('verdict-hidden');render();} }
function nextCard(){ if(idx<deck.length-1){idx++;flipped=false;document.getElementById('cardInner').classList.remove('flipped');document.getElementById('verdictRow').classList.add('verdict-hidden');render();} }

function render(){ if(!deck.length)return; const c=deck[Math.min(idx,deck.length-1)]; const ct=cardType(c);
  const labels = {concept:'Question', code:'Code Review', behavioral:'Interview Question'};
  document.getElementById('frontLabel').innerHTML=labels[ct]+' &nbsp;&#x21C4; tap to flip';
  const cf=document.getElementById('cardFront'); cf.classList.remove('code-card','behav-card');
  if(ct==='code')cf.classList.add('code-card'); if(ct==='behavioral')cf.classList.add('behav-card');
  const fq=document.getElementById('frontQ'); fq.textContent=c.q; fq.classList.toggle('code-text',ct==='code');
  document.getElementById('backA').innerHTML=formatAnswer(c.a);
  const pill=document.getElementById('sectionPill'); pill.textContent=c.s; pill.className='section-pill '+ct;
  document.getElementById('cardCounter').textContent='Card '+(idx+1)+' of '+deck.length;
  const done=got+missed; document.getElementById('sTotal').textContent=deck.length;
  document.getElementById('sGot').textContent=got; document.getElementById('sMiss').textContent=missed;
  document.getElementById('sLeft').textContent=deck.length-done;
  document.getElementById('progressFill').style.width=(deck.length?Math.round(done/deck.length*100):0)+'%'; }

function formatAnswer(a){ const esc=a.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const parts=esc.split('\n'); let out='',inCode=false,codeBuf='';
  for(const line of parts){ const ic=/^  /.test(line)&&line.trim().length>0;
    if(ic){inCode=true;codeBuf+=(codeBuf?'\n':'')+line.trim();}
    else{ if(inCode){out+='<pre>'+codeBuf+'</pre>';codeBuf='';inCode=false;} out+=(out&&!out.endsWith('</pre>'))?'<br>'+line:line; } }
  if(inCode)out+='<pre>'+codeBuf+'</pre>'; return out; }

function showDone(){ document.getElementById('cardScene').classList.add('hidden'); document.getElementById('footer').classList.add('hidden');
  document.getElementById('doneBanner').style.display='block';
  const pct=deck.length?Math.round(got/deck.length*100):0;
  document.getElementById('doneStats').textContent='You got '+got+' of '+deck.length+' correct ('+pct+'%). '+missed+' cards saved for review.';
  document.getElementById('reviewMissedBtn').style.display=missedCards.length>0?'inline-block':'none';
  const sc=loadMissed().length; const sb=document.getElementById('reviewSavedDoneBtn');
  sb.textContent='Review all saved ('+sc+')'; sb.style.display=sc>0?'inline-block':'none'; }

updateSavedPill(); filterSection();
</script>
</body>
</html>
