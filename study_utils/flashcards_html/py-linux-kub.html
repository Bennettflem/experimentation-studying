es.\nSDET ANGLE: /health and /ready endpoints are code - test them like any\nAPI: correct codes, fast, no side effects.", "g": ["k8s"]}, {"s": "Concept: Kubernetes", "q": "[KC6] Labels, selectors, and annotations\n\nWhat are labels for, and who uses them? How are annotations different?\nHow would you list only the test-environment pods of one app - and why\ndoes that matter for test tooling?", "a": "ANSWERS:\n- Labels are key/value tags (app=api, env=test, version=v2). They are\n  how Kubernetes LINKS objects: Services select pods by label,\n  Deployments own their ReplicaSets by label, network policies target\n  labels. K4's broken service was a label/selector mismatch.\n- Selecting:\n    kubectl get pods -l app=api,env=test\n    kubectl get pods -l 'env in (test,staging)'\n  plus --show-labels to display them.\n- Annotations are also key/value but hold NON-identifying metadata\n  (build SHA, owner, tool state) - you cannot select by them.\nSDET USE: label every test resource (env=test, run-id=123) so cleanup\nis one command - kubectl delete pods -l run-id=123 - and your tooling\nphysically cannot touch anything unlabeled (i.e., prod).", "g": ["k8s"]}, {"s": "Concept: Kubernetes", "q": "[KC7] Pod status vocabulary\n\nTriage quiz - what does each mean, and what's your FIRST command for\neach?\n\nPending / ImagePullBackOff / CrashLoopBackOff / OOMKilled / Completed /\nEvicted / Running but READY 0/1", "a": "CHEAT SHEET (status -> meaning -> first move):\n- Pending: never scheduled (resources, taints, volumes). -> describe\n  pod; read the FailedScheduling event (K10).\n- ImagePullBackOff: image can't be fetched (tag typo, deleted, registry\n  auth). -> describe pod; read the pull error (K2).\n- CrashLoopBackOff: starts, dies, repeats with growing back-off delay.\n  -> logs --previous for the dying container's last words (K1/K3).\n- OOMKilled (exit 137): exceeded its memory LIMIT; kernel killed it. ->\n  describe (Last State), compare limits to kubectl top.\n- Completed: exited 0 - NORMAL for Jobs, wrong for a server (the\n  process quit).\n- Evicted: node ran out of resources; kubelet expelled the pod. ->\n  describe for the eviction reason; check node pressure.\n- Running + READY 0/1: alive but failing READINESS - receives no\n  traffic (M5).\nFluency in this table IS the \"triage test failures with precision and\naccuracy\" bullet from the job description.", "g": ["k8s"]}, {"s": "Concept: Kubernetes", "q": "[KC8] The life of kubectl apply\n\nWalk through what happens - component by component - between typing\n'kubectl apply -f deployment.yaml' and traffic reaching the new pods.", "a": "THE FLOW (nailing this shows you understand the whole architecture):\n1. kubectl sends the manifest to the API SERVER (authentication ->\n   RBAC authorization -> admission webhooks may validate/mutate it).\n2. The API server persists the Deployment object in ETCD. Nothing has\n   \"run\" yet - state has merely been declared.\n3. The DEPLOYMENT controller notices and creates/updates a ReplicaSet;\n   the REPLICASET controller creates the pod objects.\n4. The SCHEDULER assigns each unscheduled pod to a node (resources,\n   affinity, taints).\n5. That node's KUBELET sees its assignment, has the runtime pull the\n   image and start containers, then runs the PROBES.\n6. When READINESS passes, the endpoints controller adds the pod IP to\n   the Service's endpoints, and KUBE-PROXY rules route traffic to it.\nROLLING UPDATE: steps 3-6 repeat gradually - new ReplicaSet scales up\nas the old scales down (maxSurge / maxUnavailable); a failure stalls at\nstep 5/6 and rollout status times out (K5).\nEvery arrow in this chain is a place to probe when \"apply worked but\ntraffic doesn't flow.\"", "g": ["k8s"]}, {"s": "Code: Pytest & Automation", "q": "[T1] Pytest basics and discovery\n\n# file: test_math_utils.py\nfrom math_utils import add\n\ndef test_add_positive():\n    assert add(2, 3) == 5\n\ndef test_add_negative():\n    assert add(-2, -3) == -5\n\ndef test_add_mixed():\n    result = add(-2, 5)\n    assert result == 3, f\"expected 3, got {result}\"\n\n# How is this run? How does pytest find these tests?\n# What happens on assertion failure?", "a": "EXPLAIN: pytest discovers tests by CONVENTION: files named test_*.py (or\n*_test.py), functions named test_*, classes named Test*. No registration, no\nboilerplate - plain functions with plain assert.\nASSERT INTROSPECTION: pytest rewrites assert statements so a failure shows\nthe actual values: \"assert 4 == 5 where 4 = add(2, 2)\". That's why you use\nbare assert, not unittest's assertEqual. The custom message (3rd test) adds\ncontext but isn't required.\nRUNNING: pytest (whole dir), pytest -v (verbose), pytest test_math_utils.py,\npytest -k negative (name filter), pytest -x (stop at first failure).\nCI ANGLE: pytest's exit code is 0 if all pass, nonzero otherwise - that's\nhow the pipeline gates (connects to B5/M9 exit-code cards).", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T2] Expecting exceptions\n\nimport pytest\nfrom parser import parse_port\n\ndef test_valid_port():\n    assert parse_port(\"8080\") == 8080\n\ndef test_invalid_port_raises():\n    with pytest.raises(ValueError):\n        parse_port(\"not-a-number\")\n\ndef test_error_message():\n    with pytest.raises(ValueError, match=\"out of range\"):\n        parse_port(\"99999\")", "a": "EXPLAIN: pytest.raises is a context manager that PASSES only if the block\nraises the given exception type. If parse_port returns normally, the test\nFAILS (\"DID NOT RAISE\"). match= applies a regex to the exception message -\nverifying not just that it failed, but that it failed with a useful error.\nWHY IT MATTERS: error paths are where real bugs hide (see M1 - the broken\nerror handler). An SDET tests the failure contract, not just the happy path.\nFOLLOW-UP: capture details with `as exc_info:` then inspect\nexc_info.value. Too-broad `pytest.raises(Exception)` is the anti-pattern -\nit passes on ANY crash, including bugs.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T3] Fixture with setup and teardown\n\nimport pytest\nimport requests\n\n@pytest.fixture\ndef api_session():\n    s = requests.Session()\n    s.headers[\"Authorization\"] = \"Bearer test-token\"\n    yield s\n    s.close()\n\ndef test_health(api_session):\n    r = api_session.get(\"http://api:8080/health\", timeout=5)\n    assert r.status_code == 200\n\ndef test_version(api_session):\n    r = api_session.get(\"http://api:8080/version\", timeout=5)\n    assert r.json()[\"version\"].startswith(\"2.\")", "a": "EXPLAIN: A fixture is a function decorated with @pytest.fixture; a test\nreceives it by naming it AS A PARAMETER - pytest wires it up (dependency\ninjection by name). Code before yield = setup; the yielded value is what the\ntest gets; code after yield = teardown.\nKEY GUARANTEE: teardown after yield runs EVEN IF THE TEST FAILS - this is\nthe correct fix for P32/M12's leaked-cleanup bugs. Each test here gets a\nfresh session by default (function scope).\nWHY A SESSION: reuses the TCP connection and carries the auth header for\nevery request (same rationale as P26).", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T4] Fixture scope\n\nimport pytest\n\n@pytest.fixture(scope=\"module\")\ndef config():\n    return {\"host\": \"localhost\", \"retries\": 3}\n\ndef test_override_retries(config):\n    config[\"retries\"] = 10\n    assert config[\"retries\"] == 10\n\ndef test_default_retries(config):\n    assert config[\"retries\"] == 3", "a": "BUG: scope=\"module\" means the fixture runs ONCE for the whole file - both\ntests share the SAME dict. test_override_retries mutates it to 10, so\ntest_default_retries fails... but only if it runs second. Run alone, it\npasses. Classic order-dependent, \"works on my machine\" flakiness - the\npytest version of P25's shared-defaults bug.\nFIX: use function scope (the default) so each test gets a fresh dict, or\nhave the fixture return a copy.\nSCOPES TO KNOW: function (default) > class > module > session. Use broader\nscopes ONLY for expensive, read-only resources (DB connection, started\nservice); never for mutable state tests will modify.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T5] Parametrize\n\nimport pytest\nfrom parser import parse_port\n\n@pytest.mark.parametrize(\"raw,expected\", [\n    (\"80\", 80),\n    (\"  443 \", 443),\n    (\"65535\", 65535),\n])\ndef test_parse_port_valid(raw, expected):\n    assert parse_port(raw) == expected\n\n@pytest.mark.parametrize(\"bad\", [\"\", \"abc\", \"-1\", \"70000\"])\ndef test_parse_port_invalid(bad):\n    with pytest.raises(ValueError):\n        parse_port(bad)", "a": "EXPLAIN: @pytest.mark.parametrize generates ONE TEST PER TUPLE - here 3\nvalid + 4 invalid = 7 independent tests, each reported separately\n(test_parse_port_valid[80], [  443 ], ...). A failure in one doesn't hide\nthe others.\nPATTERN TO NAME: table-driven testing - same idea as Go's table tests,\nwhich this team's Go developers will use daily. Nice cross-language talking\npoint.\nNOTE: the second function combines parametrize with pytest.raises - the\nstandard shape for validating error contracts across many bad inputs.\nEDGE CASES SHOWN: whitespace, boundaries (65535), empty string, negative,\nover-range - say the words \"boundary values.\"", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T6] One test, many checks\n\nimport requests\n\nBASE = \"http://api:8080\"\n\ndef test_all_endpoints():\n    for path in [\"/health\", \"/users\", \"/orders\", \"/metrics\"]:\n        r = requests.get(BASE + path, timeout=5)\n        assert r.status_code == 200", "a": "WHAT'S WRONG:\n1. It's ONE test: if /health fails, the loop stops and you learn nothing\n   about /users, /orders, /metrics. One bug masks three unknowns.\n2. The report just says test_all_endpoints failed - you must read the\n   traceback to find which path.\n3. No isolation: all-or-nothing signal, harder triage.\nFIX: @pytest.mark.parametrize(\"path\", [...]) - four independent, named,\nindividually-reported tests (exactly T5's mechanism).\nNUANCE WORTH SAYING: loops inside a test are fine for building data; they're\nwrong when each iteration is really a separate CASE.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T7] conftest.py - starting a Go service under test\n\n# file: conftest.py\nimport pytest\nimport subprocess\nimport time\n\n@pytest.fixture(scope=\"session\")\ndef go_service():\n    proc = subprocess.Popen(\n        [\"./bin/data-exchange\", \"--port=9000\"])\n    time.sleep(2)\n    yield \"http://localhost:9000\"\n    proc.terminate()\n    proc.wait(timeout=5)\n\n# file: test_exchange.py\nimport requests\n\ndef test_service_healthy(go_service):\n    r = requests.get(f\"{go_service}/health\", timeout=5)\n    assert r.status_code == 200", "a": "EXPLAIN: conftest.py holds fixtures shared across the whole test directory -\nno imports needed; pytest finds go_service automatically. scope=\"session\"\nstarts the Go binary ONCE for the entire run and tears it down at the end:\nright choice for an expensive external process.\nThis is the real shape of this team's work: Python orchestrating a compiled\nGo microservice.\nISSUES TO CATCH:\n1. time.sleep(2) is a fixed-sleep flake (P31/M8) - poll /health with a\n   deadline instead.\n2. If startup fails, tests fail confusingly later - assert readiness in the\n   fixture and pytest.fail(\"service didn't start\") early.\n3. terminate() sends SIGTERM; if the service ignores it, wait(timeout=5)\n   raises - follow with proc.kill() in an except block.\n4. Popen before yield with no try: if anything between fails, the process\n   leaks.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T8] Black-box testing a C binary\n\nimport subprocess\n\ndef test_checksum_valid_input():\n    result = subprocess.run(\n        [\"./bin/checksum\", \"testdata/sample.bin\"],\n        capture_output=True, text=True, timeout=10)\n    assert result.returncode == 0\n    assert result.stdout.strip() == \"a1b2c3d4\"\n    assert result.stderr == \"\"\n\ndef test_checksum_missing_file():\n    result = subprocess.run(\n        [\"./bin/checksum\", \"does-not-exist.bin\"],\n        capture_output=True, text=True, timeout=10)\n    assert result.returncode == 2\n    assert \"No such file\" in result.stderr", "a": "EXPLAIN: The test never sees C source - it verifies the binary's CONTRACT:\nexit code, stdout, stderr. subprocess.run with a LIST (no shell=True - P23),\ncapture_output+text to grab both streams, timeout=10 so a hung binary fails\nthe test instead of hanging CI.\nKEY DETAILS TO NAME:\n- No check=True here ON PURPOSE: for the missing-file case, returncode 2 IS\n  the expected result, so we assert on it instead of raising.\n- stdout is the data channel, stderr the error channel - asserting\n  stderr == \"\" on success catches noisy warnings.\n- Exit-code conventions: 0 success, nonzero failure classes (ties to B5).\nEXTENSIONS: run it under valgrind in CI, feed crafted binary files\n(truncated, huge, empty) - boundary testing at the process level.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T9] Mocking an HTTP dependency\n\n# file: mymodule.py\nimport requests\nBASE = \"http://api:8080\"\n\ndef get_user_name(user_id):\n    r = requests.get(f\"{BASE}/users/{user_id}\", timeout=5)\n    r.raise_for_status()\n    return r.json()[\"name\"]\n\n# file: test_mymodule.py\nfrom unittest.mock import patch, Mock\nfrom mymodule import get_user_name\n\n@patch(\"mymodule.requests.get\")\ndef test_get_user_name(mock_get):\n    mock_get.return_value = Mock(\n        status_code=200,\n        json=lambda: {\"name\": \"alice\"})\n    assert get_user_name(5) == \"alice\"\n    mock_get.assert_called_once()", "a": "EXPLAIN: @patch(\"mymodule.requests.get\") replaces requests.get ONLY as seen\nfrom mymodule, for the duration of the test. The mock is passed in as\nmock_get. return_value=Mock(...) fakes the response: status_code attribute,\njson as a callable. Mock auto-creates raise_for_status so it silently\n\"succeeds.\"\nGOLDEN RULE: patch WHERE IT'S USED (mymodule.requests.get), not where it's\ndefined (requests.get) - the #1 mocking mistake.\nassert_called_once() verifies the interaction happened.\nSDET JUDGMENT: mock for UNIT tests (fast, no network, deterministic); do\nNOT mock in integration tests - a fully-mocked integration suite proves\nnothing about the real Go service. Know both layers of the pyramid.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T10] monkeypatch and environment variables\n\n# file: dbconf.py\nimport os\n\ndef get_db_url():\n    host = os.environ[\"DB_HOST\"]\n    port = os.getenv(\"DB_PORT\", \"5432\")\n    return f\"postgresql://{host}:{port}\"\n\n# file: test_dbconf.py\nfrom dbconf import get_db_url\n\ndef test_db_url(monkeypatch):\n    monkeypatch.setenv(\"DB_HOST\", \"testdb\")\n    monkeypatch.delenv(\"DB_PORT\", raising=False)\n    assert get_db_url() == \"postgresql://testdb:5432\"", "a": "EXPLAIN: monkeypatch is a built-in pytest fixture. setenv/delenv (and\nsetattr/chdir) apply the change for THIS TEST ONLY and automatically undo\nit afterward - even on failure. raising=False makes delenv tolerate the\nvar not existing.\nWHY NOT os.environ[\"DB_HOST\"] = \"testdb\" directly? That LEAKS into every\nlater test in the same process - order-dependent flakiness again (T4's\nlesson, environment edition).\nCONNECTS TO: P30 (env vars are strings, KeyError on missing required vars) -\nthis is how you TEST that behavior: delenv DB_HOST and assert KeyError with\npytest.raises.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T11] Markers: skip, xfail, custom\n\nimport pytest\nimport shutil\n\n@pytest.mark.skipif(shutil.which(\"kubectl\") is None,\n                    reason=\"kubectl not installed\")\ndef test_pods_running():\n    ...\n\n@pytest.mark.xfail(reason=\"known bug DE-1234\")\ndef test_unicode_filenames():\n    ...\n\n@pytest.mark.slow\ndef test_full_data_sync():\n    ...\n\n# How do you run everything EXCEPT the slow tests?", "a": "EXPLAIN:\n- skipif: skip when a condition holds - here, no kubectl on the box. Shown\n  as 's' in output; not a failure. Keeps the suite runnable on laptops that\n  lack cluster tooling.\n- xfail: test is EXPECTED to fail (known bug, ticket referenced). Reported\n  as 'x', doesn't break the build; if it unexpectedly PASSES it's XPASS -\n  signal that the bug may be fixed (strict=True turns XPASS into a failure).\n- Custom markers (slow): select/deselect at run time:\n  pytest -m \"not slow\"      # skip the slow ones\n  pytest -m slow            # only the slow ones\n  Register custom markers in pytest.ini or you get warnings.\nCI ANGLE: markers are how one suite serves both fast PR checks and full\nnightly runs.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T12] tmp_path fixture\n\nfrom logparse import count_levels\n\ndef test_log_parser(tmp_path):\n    log = tmp_path / \"app.log\"\n    log.write_text(\n        \"2026-07-01 10:00:00 INFO started\\n\"\n        \"2026-07-01 10:00:05 ERROR db down\\n\"\n        \"2026-07-01 10:00:09 ERROR retrying\\n\")\n\n    counts = count_levels(str(log))\n\n    assert counts[\"ERROR\"] == 2\n    assert counts[\"INFO\"] == 1", "a": "EXPLAIN: tmp_path is a built-in fixture providing a UNIQUE, per-test\ndirectory as a pathlib.Path. write_text creates the file; pytest cleans old\ntemp dirs automatically. Unique-per-test means parallel runs (pytest -n)\nnever collide.\nTHIS REPLACES P32's broken pattern: no hardcoded filename, no manual\nos.remove, no leak when the assert fails.\nTEST DESIGN POINT: the test fabricates a controlled input file rather than\ndepending on a real log - deterministic, self-contained, and it documents\nthe expected log format right in the test.", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T13] Capturing output with capsys\n\ndef report(results):\n    passed = sum(1 for r in results if r)\n    print(f\"{passed}/{len(results)} passed\")\n\ndef test_report_output(capsys):\n    report([True, True, False])\n    captured = capsys.readouterr()\n    assert captured.out == \"2/3 passed\\n\"\n    assert captured.err == \"\"", "a": "EXPLAIN: capsys is a built-in fixture that captures stdout/stderr written\nduring the test. readouterr() returns (out, err) and RESETS the capture.\nAsserting err == \"\" catches stray warnings.\nWHEN IT MATTERS HERE: lots of test tooling and CLI wrappers around C\nbinaries communicate by printing - this is how you unit-test that layer.\nNote the trailing \"\\n\" from print in the expected value - an easy\noff-by-one-character failure.\nRELATED: caplog captures logging-module output the same way; capfd captures\nat the file-descriptor level (needed when a C extension writes directly to\nfd 1).", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T14] A test with conditional assertions\n\ndef test_create_and_delete_user(api):\n    r = api.post(\"/users\", json={\"name\": \"temp\"})\n    if r.status_code == 201:\n        user_id = r.json()[\"id\"]\n        assert api.get(f\"/users/{user_id}\").status_code == 200\n        api.delete(f\"/users/{user_id}\")", "a": "BUG: every assert is INSIDE `if r.status_code == 201`. If the POST fails\n(500, 400, connection refused via fixture), the if-block is skipped and the\ntest PASSES with zero assertions executed. Green build, broken API - the\nmost dangerous kind of test (P35's lesson in API form).\nALSO: the DELETE cleanup is inside the conditional and not protected -\nM12's leak pattern.\nFIX:\n  r = api.post(\"/users\", json={\"name\": \"temp\"})\n  assert r.status_code == 201          # setup must be asserted\n  user_id = r.json()[\"id\"]\n  try:\n      assert api.get(f\"/users/{user_id}\").status_code == 200\n  finally:\n      api.delete(f\"/users/{user_id}\")  # or a fixture teardown\nRULE TO SAY: \"a test should not be able to pass silently - assert the\nsetup, and put cleanup in teardown.\"", "g": ["python"]}, {"s": "Code: Pytest & Automation", "q": "[T15] pytest configuration and CI integration\n\n# file: pytest.ini\n[pytest]\ntestpaths = tests\naddopts = -v --tb=short --junitxml=results.xml\nmarkers =\n    slow: long-running integration tests\n    requires_cluster: needs a live Kubernetes cluster\n\n# CI pipeline step:\n#   pytest -m \"not requires_cluster\"\n#   echo \"pytest exit code: $?\"", "a": "EXPLAIN:\n- pytest.ini centralizes config: testpaths limits discovery, addopts are\n  flags applied to every run, markers registers custom marks (T11).\n- --junitxml=results.xml writes machine-readable results that CI systems\n  (Jenkins, GitLab, Azure DevOps) parse to show pass/fail dashboards and\n  history - this is where the \"produce and analyze quality metrics\" line\n  in the job description lives (pass rate, flaky rate, duration trends).\n- --tb=short keeps CI logs readable.\n- Exit codes: 0 all passed, 1 some failed, 2 interrupted, 4 usage error,\n  5 NO TESTS COLLECTED - that last one matters: a misconfigured testpaths\n  silently collecting zero tests should FAIL the pipeline, not pass it.\n- The -m \"not requires_cluster\" run shows one suite, two profiles: fast PR\n  gate vs full environment-backed run.", "g": ["python"]}, {"s": "Code: Mixed Mock", "q": "[M1]  (step 1: identify the language)\n\ndef parse_response(resp):\n    if resp[\"status\"] == \"ok\":\n        return resp[\"data\"]\n    else:\n        raise ValueError(resp[\"error\"])\n\nresp = {\"status\": \"ok\", \"data\": [1, 2, 3]}\nprint(parse_response(resp))\n\nbad = {\"status\": \"fail\"}\nprint(parse_response(bad))", "a": "OUTPUT: [1, 2, 3], then KeyError: 'error' (NOT ValueError).\nWHY: bad has no \"error\" key, so building the ValueError message itself\ncrashes with KeyError first. The error-handling path is untested - a very\ncommon real bug (\"the error handler is broken\").\nFIX: resp.get(\"error\", \"unknown error\"). Also consider resp missing \"status\"\nentirely.\nLESSON: test your failure paths, not just happy paths.", "g": ["python"]}, {"s": "Code: Mixed Mock", "q": "[M2]  (step 1: identify the language)\n\n#!/bin/bash\npods=$(kubectl get pods --no-headers 2>/dev/null | wc -l)\nrunning=$(kubectl get pods --no-headers 2>/dev/null | grep -c \" Running \")\n\necho \"$running of $pods pods running\"\n\nif [ \"$pods\" -ne \"$running\" ]; then\n    kubectl get pods --no-headers | grep -v \" Running \"\nfi", "a": "WHAT IT DOES: Counts total pods and Running pods, reports the ratio, and\nlists non-Running pods when they differ.\nEXPLAIN: --no-headers removes the header row so wc -l counts only pods;\ngrep -c counts matching lines; 2>/dev/null hides kubectl errors.\nISSUES: (1) If kubectl fails, both counts are 0 and the script happily says\n\"0 of 0\" - hiding stderr masks real failures; check kubectl's exit code.\n(2) grep \" Running \" with spaces is fragile against column spacing - safer:\nkubectl get pods --field-selector=status.phase=Running --no-headers | wc -l.\n(3) Running pods can still be unready (0/1) - \"Running\" != healthy.", "g": ["bash", "k8s"]}, {"s": "Code: Mixed Mock", "q": "[M3]  (step 1: identify the language)\n\nBEGIN;\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE id = 1;\n\nUPDATE accounts\nSET balance = balance + 100\nWHERE id = 2;\n\nCOMMIT;", "a": "WHAT IT DOES: Transfers 100 from account 1 to account 2 atomically.\nEXPLAIN: BEGIN...COMMIT is a transaction - both updates succeed together or\n(on ROLLBACK/error) neither applies. Without it, a crash between the updates\ndestroys 100 units of money (debit without credit). ACID - atomicity is the\nkey word here.\nQUESTIONS THEY'LL ASK: \"What if the second update fails?\" -> the transaction\nis not committed; the client/DB rolls back, account 1 keeps its money.\nSUBTLE POINT: UPDATE ... WHERE id=999 that matches NO rows is NOT an error -\nit \"succeeds\" affecting 0 rows. Real transfer code must check row counts and\nthat balance >= 100 (constraint or WHERE balance >= 100).", "g": []}, {"s": "Code: Mixed Mock", "q": "[M4]  (step 1: identify the language)\n\nimport subprocess\nimport json\nimport sys\n\nresult = subprocess.run(\n    [\"kubectl\", \"get\", \"deployment\", \"api\", \"-o\", \"json\"],\n    capture_output=True, text=True, check=True)\n\ndep = json.loads(result.stdout)\ndesired = dep[\"spec\"][\"replicas\"]\nready = dep[\"status\"].get(\"readyReplicas\", 0)\n\nprint(f\"{ready}/{desired} replicas ready\")\nif ready < desired:\n    sys.exit(1)", "a": "WHAT IT DOES: Fetches deployment \"api\" as JSON, compares readyReplicas to\nspec.replicas, exits 1 if not all ready - a health gate for CI.\nEXPLAIN: check=True raises if kubectl fails (good - contrast with P23);\n.get(\"readyReplicas\", 0) handles the field being ABSENT, which happens when\nzero replicas are ready (K8s omits it) - nice defensive detail to point out.\nsys.exit(1) makes the failure visible to the calling pipeline.\nIMPROVEMENTS: catch CalledProcessError and print stderr for a clean message;\n\"$spec.replicas\" could be None if not set (defaults to 1).", "g": ["python", "k8s"]}, {"s": "Code: Mixed Mock", "q": "[M5]  (step 1: identify the language)\n\n$ kubectl describe pod api-7d9f8b6c5-x2m4p\n...\nEvents:\n  Warning  Unhealthy  2m (x12 over 5m)  kubelet\n      Readiness probe failed: HTTP probe failed with statuscode: 500\n\n$ kubectl get pods\nNAME                   READY   STATUS    RESTARTS   AGE\napi-7d9f8b6c5-x2m4p    0/1     Running   0          6m", "a": "ANSWERS:\n- Pod is Running with 0 restarts but READY 0/1: the process is UP but its\n  readiness probe (HTTP check) returns 500, so Kubernetes marks it unready\n  and REMOVES it from service endpoints - no traffic reaches it.\n- Running != Ready is the concept being tested. Liveness probe failure\n  restarts the container; READINESS failure just withholds traffic.\nNEXT: kubectl logs the pod (why is /health 500? DB dependency down?), exec\nin and curl the probe endpoint locally, check the probe's path/port in the\ndeployment spec (a wrong probe path also looks exactly like this).", "g": ["k8s"]}, {"s": "Code: Mixed Mock", "q": "[M6]  (step 1: identify the language)\n\n#!/bin/bash\ntail -F /var/log/myapp/app.log | while read -r line\ndo\n    echo \"$line\" | grep -q \"FATAL\" && echo \"ALERT: $line\"\ndone", "a": "WHAT IT DOES: Follows the log in real time; prints an ALERT line whenever a\nFATAL line appears.\nEXPLAIN: tail -F (capital) survives log rotation by re-opening the file by\nNAME (-f follows the file descriptor and goes silent after rotation - key\ndifference). cmd && cmd2 runs cmd2 only if cmd succeeded - here grep -q's\nexit code gates the alert.\nIMPROVEMENTS: simpler & faster: tail -F file | grep --line-buffered FATAL.\nThe while loop runs a grep per line (a process per line - expensive).\nSUBTLETY (if pushed): variables set inside the piped while live in a\nsubshell and vanish after the loop.", "g": ["bash"]}, {"s": "Code: Mixed Mock", "q": "[M7]  (step 1: identify the language)\n\nSELECT status, COUNT(*) AS total\nFROM test_runs\nWHERE started_at > NOW() - INTERVAL '7 days'\nGROUP BY status\nORDER BY total DESC;", "a": "WHAT IT DOES: For the last 7 days of test runs, counts runs per status,\nmost frequent first - e.g., a pass/fail dashboard query.\nEXPLAIN: GROUP BY collapses rows per status; COUNT(*) counts rows in each\ngroup; AS total names the column; ORDER BY total DESC sorts; the WHERE\nfilters BEFORE grouping (contrast: HAVING filters AFTER aggregation - e.g.,\nHAVING COUNT(*) > 10).\nFOLLOW-UP: add pass RATE -> use conditional aggregation or a second query;\nan index on started_at keeps this fast as the table grows.", "g": []}, {"s": "Code: Mixed Mock", "q": "[M8]  (step 1: identify the language)\n\nimport time\n\ndef test_cache_expiry(cache):\n    cache.set(\"key\", \"value\", ttl=1)\n    time.sleep(1)\n    assert cache.get(\"key\") is None", "a": "BUG: TTL is 1s and the test sleeps EXACTLY 1s - it races the expiry\nboundary. Depending on timer resolution and scheduling, the key is\nsometimes still alive -> intermittent failure. Textbook flaky test.\nFIX: sleep comfortably past the boundary (ttl=1, sleep 1.5) or better, poll:\nloop until cache.get returns None with a deadline, fail if exceeded.\nALSO TEST the other side: immediately after set, the key SHOULD exist\n(sleep 0.5 -> assert value present).\nSAY THE PHRASE: \"boundary condition + wall-clock timing = flaky.\"", "g": ["python"]}, {"s": "Code: Mixed Mock", "q": "[M9]  (step 1: identify the language)\n\n#!/bin/bash\nmake build && make test || echo \"pipeline failed\"\necho \"exit code: $?\"", "a": "WHAT IT DOES: a && b || c runs left to right: if build succeeds, run test;\nif test fails OR build fails, run echo.\nSUBTLETIES:\n1. It is NOT if/else: if build succeeds and test succeeds, echo is skipped\n   (fine) - but if build FAILS, echo also runs, so you can't tell WHICH\n   stage failed.\n2. Exit-code bug: echo succeeds, so after a failure the LINE's exit status\n   is 0 - \"exit code: 0\" prints and CI thinks the pipeline PASSED.\nFIX: proper if/else, or `make build && make test || { echo \"failed\"; exit 1; }`.", "g": ["bash"]}, {"s": "Code: Mixed Mock", "q": "[M10]  (step 1: identify the language)\n\ndef compare_files(expected_path, actual_path):\n    with open(expected_path) as e, open(actual_path) as a:\n        expected = e.readlines()\n        actual = a.readlines()\n\n    if len(expected) != len(actual):\n        print(\"line count differs\")\n        return False\n\n    for i in range(len(expected)):\n        if expected[i].strip() != actual[i].strip():\n            print(f\"line {i + 1} differs\")\n            return False\n\n    return True", "a": "WHAT IT DOES: Compares two files line by line (whitespace-trimmed); reports\nthe first difference; returns True only if same length and all lines match.\nEXPLAIN: two files in one with statement; readlines() loads both fully into\nmemory (fine for small expected/actual fixtures; for huge files iterate with\nzip); .strip() makes the compare tolerant of trailing whitespace/newline\nstyle - deliberate choice, but note it also HIDES real leading-whitespace\ndiffs (could matter for YAML!).\nIMPROVEMENTS: report BOTH lines on mismatch for debuggability; difflib\n.unified_diff gives a full diff; zip(expected, actual) with enumerate is\nmore Pythonic than range(len(...)).", "g": ["python"]}, {"s": "Code: Mixed Mock", "q": "[M11]  (step 1: identify the language)\n\nBEGIN;\n\nDELETE FROM test_results\nWHERE run_id = 42;\n\nDELETE FROM test_runs;\n\nCOMMIT;", "a": "BUG: The second DELETE has NO WHERE clause - it deletes EVERY row in\ntest_runs, not just run 42. Because it's inside the transaction, COMMIT\nmakes the wipe permanent and atomic.\nFIX: DELETE FROM test_runs WHERE id = 42;\nDISCUSS: This is why you (1) run DELETEs inside a transaction and check\naffected row counts BEFORE committing, (2) test destructive scripts against\na copy first, (3) note child rows (test_results) are deleted first to\nsatisfy the foreign key - deleting parent first would violate it (unless ON\nDELETE CASCADE).", "g": []}, {"s": "Code: Mixed Mock", "q": "[M12]  (step 1: identify the language)\n\ndef test_end_to_end(client):\n    resp = client.post(\"/users\", json={\"name\": \"temp-user\"})\n    user_id = resp.json()[\"id\"]\n\n    resp = client.get(f\"/users/{user_id}\")\n    assert resp.status_code == 200\n    assert resp.json()[\"name\"] == \"temp-user\"\n\n    client.delete(f\"/users/{user_id}\")", "a": "WHAT IT DOES: End-to-end test: create user -> read it back -> verify ->\ndelete. Setup / action / assertion / teardown - name those phases.\nBUGS:\n1. If either assert fails, client.delete NEVER runs - the temp user leaks\n   (test pollution; reruns may collide). Put cleanup in try/finally or a\n   fixture with teardown (same lesson as P32/B19).\n2. The POST's status is never checked; if creation fails, resp.json()[\"id\"]\n   raises KeyError and the failure message points at the wrong place.\n   Assert the setup succeeded (201 + \"id\" present) before proceeding.\n3. Fixed name \"temp-user\" - use unique data (uuid) for parallel-safe runs.\nBONUS: also assert the DELETE worked (GET afterward -> 404) - close the loop.", "g": ["python"]}];

const LS_KEY='sdet_flash_v1';
function saveMissed(cards){ try{ localStorage.setItem(LS_KEY,JSON.stringify(cards.map(c=>c.q))); }catch(e){} }
function loadMissed(){ try{ const r=localStorage.getItem(LS_KEY); if(!r)return[]; return JSON.parse(r).map(q=>ALL_CARDS.find(c=>c.q===q)).filter(Boolean); }catch(e){ return[]; } }
function clearSaved(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }

let deck=[],idx=0,flipped=false,got=0,missed=0,section='all',missedCards=[];
function isCodeCard(c){ return c.s.startsWith('Code:'); }
function isBehavCard(c){ return c.s.startsWith('Values:') || c.s.startsWith('Competency:'); }
function cardType(c){ if(isCodeCard(c))return'code'; if(isBehavCard(c))return'behavioral'; return'concept'; }

function updateSavedPill(){
  const saved=loadMissed(); const pill=document.getElementById('savedPill'); const bar=document.getElementById('savedBar');
  if(saved.length>0){ pill.innerHTML='&#9733; '+saved.length+' saved &mdash; tap to review'; pill.style.display='inline-block'; bar.classList.add('visible'); }
  else{ pill.style.display='none'; bar.classList.remove('visible'); }
}

function filterSection(){
  section=document.getElementById('sectionSel').value;
  if(section==='all') deck=[...ALL_CARDS];
  else if(section==='__python__') deck=ALL_CARDS.filter(c=>(c.g||[]).indexOf('python')>=0);
  else if(section==='__bash__') deck=ALL_CARDS.filter(c=>(c.g||[]).indexOf('bash')>=0);
  else if(section==='__k8s__') deck=ALL_CARDS.filter(c=>(c.g||[]).indexOf('k8s')>=0);
  else deck=ALL_CARDS.filter(c=>c.s===section);
  resetDeck(false);
}

function shuffle(){ for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]; } idx=0;got=0;missed=0;missedCards=[];flipped=false;render(); }

function resetDeck(doFilter=true){ if(doFilter)filterSection(); idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none'; document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden'); document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped'); render(); }

function reviewMissed(){ if(!missedCards.length)return; deck=[...missedCards]; idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none'; document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden'); document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped'); render(); }

function reviewSaved(){ const saved=loadMissed(); if(!saved.length)return; deck=[...saved]; section='all';
  document.getElementById('sectionSel').value='all'; idx=0;got=0;missed=0;missedCards=[];flipped=false;
  document.getElementById('doneBanner').style.display='none'; document.getElementById('cardScene').classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden'); document.getElementById('verdictRow').classList.add('verdict-hidden');
  document.getElementById('cardInner').classList.remove('flipped'); render(); }

function clearSavedCards(){ const n=loadMissed().length; if(!n)return; if(!confirm('Clear all '+n+' saved cards?'))return; clearSaved(); updateSavedPill(); }

function flipCard(){ if(idx>=deck.length)return; flipped=!flipped; document.getElementById('cardInner').classList.toggle('flipped',flipped);
  const vr=document.getElementById('verdictRow'); if(flipped)vr.classList.remove('verdict-hidden'); else vr.classList.add('verdict-hidden'); }

function verdict(wasGot){ if(!flipped)return;
  if(wasGot){ got++; const saved=loadMissed().filter(c=>c.q!==deck[idx].q); saveMissed(saved); }
  else{ missed++; missedCards.push(deck[idx]); const ex=loadMissed(); if(!ex.some(c=>c.q===deck[idx].q))saveMissed([...ex,deck[idx]]); }
  idx++;flipped=false; document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('verdictRow').classList.add('verdict-hidden'); updateSavedPill();
  if(idx>=deck.length)showDone(); else render(); }

function prevCard(){ if(idx>0){idx--;flipped=false;document.getElementById('cardInner').classList.remove('flipped');document.getElementById('verdictRow').classList.add('verdict-hidden');render();} }
function nextCard(){ if(idx<deck.length-1){idx++;flipped=false;document.getElementById('cardInner').classList.remove('flipped');document.getElementById('verdictRow').classList.add('verdict-hidden');render();} }

function render(){ if(!deck.length)return; const c=deck[Math.min(idx,deck.length-1)]; const ct=cardType(c);
  const labels = {concept:'Question', code:'Code Review', behavioral:'Interview Question'};
  document.getElementById('frontLabel').innerHTML=labels[ct]+' &nbsp;&#x21C4; tap to flip';
  const cf=document.getElementById('cardFront'); cf.classList.remove('code-card','behav-card');
  if(ct==='code')cf.classList.add('code-card'); if(ct==='behavioral')cf.classList.add('behav-card');
  const fq=document.getElementById('frontQ'); fq.textContent=c.q; fq.classList.toggle('code-text',ct==='code');
  document.getElementById('backA').innerHTML=formatAnswer(c.a);
  const pill=document.getElementById('sectionPill'); pill.textContent=c.s; pill.className='section-pill '+ct;
  document.getElementById('cardCounter').textContent='Card '+(idx+1)+' of '+deck.length;
  const done=got+missed; document.getElementById('sTotal').textContent=deck.length;
  document.getElementById('sGot').textContent=got; document.getElementById('sMiss').textContent=missed;
  document.getElementById('sLeft').textContent=deck.length-done;
  document.getElementById('progressFill').style.width=(deck.length?Math.round(done/deck.length*100):0)+'%'; }

function formatAnswer(a){ const esc=a.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const parts=esc.split('\n'); let out='',inCode=false,codeBuf='';
  for(const line of parts){ const ic=/^  /.test(line)&&line.trim().length>0;
    if(ic){inCode=true;codeBuf+=(codeBuf?'\n':'')+line.trim();}
    else{ if(inCode){out+='<pre>'+codeBuf+'</pre>';codeBuf='';inCode=false;} out+=(out&&!out.endsWith('</pre>'))?'<br>'+line:line; } }
  if(inCode)out+='<pre>'+codeBuf+'</pre>'; return out; }

function showDone(){ document.getElementById('cardScene').classList.add('hidden'); document.getElementById('footer').classList.add('hidden');
  document.getElementById('doneBanner').style.display='block';
  const pct=deck.length?Math.round(got/deck.length*100):0;
  document.getElementById('doneStats').textContent='You got '+got+' of '+deck.length+' correct ('+pct+'%). '+missed+' cards saved for review.';
  document.getElementById('reviewMissedBtn').style.display=missedCards.length>0?'inline-block':'none';
  const sc=loadMissed().length; const sb=document.getElementById('reviewSavedDoneBtn');
  sb.textContent='Review all saved ('+sc+')'; sb.style.display=sc>0?'inline-block':'none'; }

updateSavedPill(); filterSection();
</script>
